<!doctype html>
<!-- Idioma por defecto de la configuración; AppComponent lo actualiza al cambiar de idioma -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>phylax</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Splash mínimo: se pinta antes de que carguen los estilos y desaparece cuando Angular renderiza app-root -->
  <style>
    .app-splash {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
    }
    .app-splash::after {
      content: '';
      width: 40px;
      height: 40px;
      border: 4px solid rgb(128 128 128 / 25%);
      border-top-color: rgb(128 128 128 / 80%);
      border-radius: 50%;
      animation: app-splash-spin 0.8s linear infinite;
    }
    @keyframes app-splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="mat-typography">
  <noscript>Esta aplicación necesita JavaScript. / This application requires JavaScript.</noscript>
  <app-root><div class="app-splash" role="status" aria-busy="true" aria-label="Cargando…"></div></app-root>
  <!-- Marca en runtime sin JS: config/theme.css (opcional) se monta con la configuración. Va al final del body
       para cargarse después de styles.css y ganar a sus :root/html con la misma especificidad. -->
  <link rel="stylesheet" href="config/theme.css" onerror="this.remove()">
</body>
</html>
