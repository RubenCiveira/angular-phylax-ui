<!-- @autogenerated -->
<ng-template #contextualTemplate let-row="row"><action-row-menu [container]="this" [row]="row" /></ng-template>
<ng-template #toolbarTemplate><action-toolbar [container]="this" /></ng-template>
<ng-template #selectionTemplate><action-selection-bar [container]="this" /></ng-template>
<ng-template #activeTemplate><action-host [container]="this" /></ng-template>

<div class="content">
  @if (activeRender) {
    @if (!parent) {
      <ng-container [ngTemplateOutlet]="theActiveTemplate() || null"></ng-container>
      <div class="title">{{ leaf.current()?.title() }}</div>
    }
    <ng-container [ngTemplateOutlet]="activeRender"></ng-container>
  } @else if (masterTemplate()) {
    <ng-container [ngTemplateOutlet]="masterTemplate()!"></ng-container>
  }
</div>
