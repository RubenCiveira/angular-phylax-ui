<!-- @autogenerated -->
@if (visible()) {
  <div class="rating-wrapper">
    @if (label()) {
      <label class="rating-label">{{ label() + '.label' | transloco }}</label>
    }
    <div
      class="rating-stars"
      [class.rating-stars--disabled]="disabled()"
      [attr.tabindex]="disabled() ? -1 : 0"
      role="slider"
      [attr.aria-label]="label() ? (label() + '.label' | transloco) : 'Rating'"
      [attr.aria-valuenow]="value() ?? 0"
      [attr.aria-valuemin]="0"
      [attr.aria-valuemax]="max()"
      (mouseleave)="onMouseLeave()"
      (keydown)="onKeyDown($event)"
    >
      @for (star of stars(); track star) {
        <button
          type="button"
          class="rating-star"
          [class]="'rating-star--' + color()"
          (click)="onClick(star, $event)"
          (mousemove)="onMouseMove(star, $event)"
          [attr.aria-label]="star"
          [disabled]="disabled() || null"
        >
          <mat-icon>{{ iconFor(star) }}</mat-icon>
        </button>
      }
    </div>
    @for (error of errorList(); track error.key) {
      <span class="rating-error">{{ errorKey(error) | transloco: error.params }}</span>
    }
  </div>
} @else if (showHiddenMark()) {
  <editable-hidden-mark [label]="label()" />
}
