<!-- @autogenerated -->
@if (visible()) {
  <div class="pin-wrapper">
    @if (label()) {
      <label class="pin-label">{{ label() + '.label' | transloco }}</label>
    }
    <div class="pin-boxes">
      @for (box of boxes; track $index) {
        <input
          #boxInput
          class="pin-box"
          [type]="mask() ? 'password' : 'text'"
          [formControl]="box"
          maxlength="1"
          autocomplete="one-time-code"
          [inputMode]="numericOnly() ? 'numeric' : 'text'"
          (keydown)="onKeyDown($event, $index)"
          (input)="onInput($event, $index)"
          (paste)="onPaste($event, $index)"
          (focus)="onFocus($index)"
        />
      }
    </div>
    @for (error of errorList(); track error.key) {
      <span class="pin-error">{{ errorKey(error) | transloco: error.params }}</span>
    }
  </div>
} @else if (showHiddenMark()) {
  <editable-hidden-mark [label]="label()" />
}
