<!-- @autogenerated -->
<div class="gantt-toolbar">
  <mat-button-toggle-group [value]="viewMode()" (change)="setViewMode($event.value)" class="gantt-mode-toggle">
    @for (m of modes; track m) {
      <mat-button-toggle [value]="m">{{ m }}</mat-button-toggle>
    }
  </mat-button-toggle-group>
</div>

@if (searching()) {
  <mat-progress-bar mode="indeterminate" class="gantt-progress"></mat-progress-bar>
}

<div class="gantt-wrapper">
  @if (!data() || data()!.length === 0) {
    <div class="gantt-empty">
      <mat-icon>view_timeline</mat-icon>
      <span>Sin tareas</span>
    </div>
  } @else {
    <div #ganttContainer class="gantt-container"></div>
  }
</div>
