<!-- @autogenerated -->
<h2 mat-dialog-title>{{ title | transloco }}</h2>
<mat-dialog-content>
  <app-page-error [asColumn]="true" [error]="data.error" [showTitle]="false" [showHome]="false" />
</mat-dialog-content>
<mat-dialog-actions align="end">
  <a mat-button mat-dialog-close [routerLink]="home()">{{ 'errors.page.home' | transloco }}</a>
  @if (data.login) {
    <button mat-flat-button (click)="login()">{{ 'auth.unauthorized.login' | transloco }}</button>
  }
  <button mat-button mat-dialog-close cdkFocusInitial>{{ 'common.notify.close' | transloco }}</button>
</mat-dialog-actions>
