<!-- @autogenerated -->
@if (retrySuccess) {
  <div class="success">
    <p>
      {{ 'errors.modal.retrySuccess' | transloco }}
      <button mat-icon-button (click)="redirect('.')">
        <mat-icon>refresh</mat-icon>
      </button>
    </p>
  </div>
}
@if (retryError) {
  <div class="error">
    <p>
      {{ 'errors.modal.retryError' | transloco }}
      <button mat-icon-button (click)="redirect('/')">
        <mat-icon>refresh</mat-icon>
      </button>
    </p>
  </div>
}
@if (showBody) {
  <div class="mat-typography">
    <app-page-error [asColumn]="true" [error]="data.error">
      @if (data.login) {
        <button mat-flat-button (click)="login()">{{ 'auth.unauthorized.login' | transloco }}</button>
      }
    </app-page-error>
  </div>
}
