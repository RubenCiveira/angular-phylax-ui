<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="themes"
    [visible]="isVisible['themes']"
    label="template.theme-asset.search.themes"
    [provider]="themesProvider"
  />
  <editable-text formControlName="search" [visible]="isVisible['search']" label="template.theme-asset.search.search" />
  <editable-text formControlName="code" [visible]="isVisible['code']" label="template.theme-asset.search.code" />
  <editable-selectone
    formControlName="theme"
    [visible]="isVisible['theme']"
    label="template.theme-asset.search.theme"
    [provider]="themeProvider"
  />
  <editable-choose
    formControlName="order"
    [visible]="isVisible['order']"
    label="template.theme-asset.search.order"
    [options]="['', 'CODE-ASC', 'CODE-DESC']"
  />
</form-layout>
