<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="snippet"
    [visible]="isVisible['snippet']"
    label="template.snippet-version.search.snippet"
    [provider]="snippetProvider"
  />
  <editable-text
    formControlName="search"
    [visible]="isVisible['search']"
    label="template.snippet-version.search.search"
  />
  <editable-selectone
    formControlName="snippets"
    [visible]="isVisible['snippets']"
    label="template.snippet-version.search.snippets"
    [provider]="snippetsProvider"
  />
</form-layout>
