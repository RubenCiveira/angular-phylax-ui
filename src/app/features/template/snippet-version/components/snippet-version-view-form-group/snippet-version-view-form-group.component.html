<form-layout [formGroup]="form" style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4">
  <editable-selectone
    formControlName="snippet"
    [visible]="isVisible['snippet']"
    label="template.snippet-version.form-group.snippet"
    [provider]="snippetProvider"
  />
  <editable-text
    formControlName="locale"
    [visible]="isVisible['locale']"
    label="template.snippet-version.form-group.locale"
  />
  <editable-text
    formControlName="subject"
    [visible]="isVisible['subject']"
    label="template.snippet-version.form-group.subject"
  />
  <editable-textarea
    formControlName="contentHtml"
    [visible]="isVisible['contentHtml']"
    label="template.snippet-version.form-group.content-html"
  />
  <editable-textarea
    formControlName="contentText"
    [visible]="isVisible['contentText']"
    label="template.snippet-version.form-group.content-text"
  />
</form-layout>
