<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="tenant"
    [visible]="isVisible['tenant']"
    label="template.template-theme.form-group.tenant"
    [provider]="tenantProvider"
  />
  <editable-text formControlName="name" [visible]="isVisible['name']" label="template.template-theme.form-group.name" />
  <editable-check
    formControlName="isDefault"
    [visible]="isVisible['isDefault']"
    label="template.template-theme.form-group.is-default"
  />
  <editable-check
    formControlName="enabled"
    [visible]="isVisible['enabled']"
    label="template.template-theme.form-group.enabled"
  />
  <editable-text
    formControlName="customCss"
    [visible]="isVisible['customCss']"
    label="template.template-theme.form-group.custom-css"
  />
</form-layout>
