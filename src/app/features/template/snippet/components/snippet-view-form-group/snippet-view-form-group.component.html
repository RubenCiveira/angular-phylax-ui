<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-text formControlName="code" [visible]="isVisible['code']" label="template.snippet.form-group.code" />
  <editable-selectone
    formControlName="tenant"
    [visible]="isVisible['tenant']"
    label="template.snippet.form-group.tenant"
    [provider]="tenantProvider"
  />
  <editable-check
    formControlName="enabled"
    [visible]="isVisible['enabled']"
    label="template.snippet.form-group.enabled"
  />
</form-layout>
