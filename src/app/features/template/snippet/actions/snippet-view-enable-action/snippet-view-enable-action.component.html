<!-- @autogenerated -->
<ng-template #dialogTemplate>
  <h2 mat-dialog-title>{{ 'template/snippet.action.enable.title' | transloco }}</h2>
  <mat-dialog-content>
    <p>{{ 'template/snippet.action.enable.content' | transloco }}</p>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button [mat-dialog-close]="false">{{ 'template/snippet.action.enable.cancelBtn' | transloco }}</button>
    <button mat-button [mat-dialog-close]="true" cdkFocusInitial>
      {{ 'template/snippet.action.enable.okBtn' | transloco }}
    </button>
  </mat-dialog-actions>
</ng-template>
