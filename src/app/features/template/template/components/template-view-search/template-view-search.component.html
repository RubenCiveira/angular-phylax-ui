<!-- @autogenerated -->
<form-layout [formGroup]="form" style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4">
  <editable-selectone
    formControlName="tenants"
    [visible]="isVisible['tenants']"
    label="template/template.search.tenants"
    [provider]="tenantsProvider"
  />
  <editable-text formControlName="search" [visible]="isVisible['search']" label="template/template.search.search" />
  <editable-text formControlName="code" [visible]="isVisible['code']" label="template/template.search.code" />
  <editable-selectone
    formControlName="global"
    [visible]="isVisible['global']"
    label="template/template.search.global"
    [provider]="globalProvider"
  />
  <editable-selectone
    formControlName="tenant"
    [visible]="isVisible['tenant']"
    label="template/template.search.tenant"
    [provider]="tenantProvider"
  />
  <editable-choose
    formControlName="order"
    [visible]="isVisible['order']"
    label="template/template.search.order"
    [options]="['', 'CODE-ASC', 'CODE-DESC']"
  />
</form-layout>
