<!-- @autogenerated -->
<ng-template #formTemplate>
  <div class="panel">
    <consent-purpose-view-form-group
      class="main"
      #updateForm
      [formControl]="form"
      [fixed]="fixedProperties()"
      [hidden]="hiddenProperties()"
      [defined]="definedProperties()"
    />
    <div class="buttons">
      <button
        mat-raised-button
        [disabled]="saving() || updateForm.form.invalid || !updateForm.form.dirty"
        (click)="save()"
      >
        {{ 'identity/consent-purpose.action.create.createButton' | transloco }}
      </button>
    </div>
  </div>
</ng-template>
