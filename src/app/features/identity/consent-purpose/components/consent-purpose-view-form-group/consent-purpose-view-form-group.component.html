<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="tenant"
    [visible]="isVisible['tenant']"
    label="identity.consent-purpose.form-group.tenant"
    [provider]="tenantProvider"
  />
  <editable-choose
    formControlName="key"
    [visible]="isVisible['key']"
    label="identity.consent-purpose.form-group.key"
    [options]="['MARKETING', 'ANALYTICS', 'THIRD-PARTY', 'PERSONALIZATION']"
  />
  <editable-text
    formControlName="title"
    [visible]="isVisible['title']"
    label="identity.consent-purpose.form-group.title"
  />
  <editable-textarea
    formControlName="description"
    [visible]="isVisible['description']"
    label="identity.consent-purpose.form-group.description"
  />
  <editable-check
    formControlName="required"
    [visible]="isVisible['required']"
    label="identity.consent-purpose.form-group.required"
  />
  <editable-datetime
    formControlName="activationDate"
    [visible]="isVisible['activationDate']"
    label="identity.consent-purpose.form-group.activation-date"
  />
</form-layout>
