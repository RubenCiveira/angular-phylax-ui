<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="tenants"
    [visible]="isVisible['tenants']"
    label="identity.consent-purpose.search.tenants"
    [provider]="tenantsProvider"
  />
  <editable-text
    formControlName="search"
    [visible]="isVisible['search']"
    label="identity.consent-purpose.search.search"
  />
  <editable-text formControlName="title" [visible]="isVisible['title']" label="identity.consent-purpose.search.title" />
  <editable-selectone
    formControlName="tenant"
    [visible]="isVisible['tenant']"
    label="identity.consent-purpose.search.tenant"
    [provider]="tenantProvider"
  />
</form-layout>
