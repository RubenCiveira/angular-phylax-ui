<!-- @autogenerated -->
<ng-template #formTemplate>
  <div class="panel">
    <tenant-config-view-form-group
      class="main"
      #createForm
      [formControl]="form"
      [fixed]="fixedProperties()"
      [hidden]="hiddenProperties()"
      [defined]="definedProperties()"
    />
    <div class="buttons">
      <button
        mat-raised-button
        [disabled]="saving() || createForm.form.invalid || !createForm.form.dirty"
        (click)="save(createForm.conflictFields)"
      >
        {{ 'identity/tenant-config.action.edit.saveBtn' | transloco }}
      </button>
    </div>
  </div>
</ng-template>
