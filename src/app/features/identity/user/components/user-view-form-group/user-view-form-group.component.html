<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="tenant"
    class="form-layout-col-lg-6 form-layout-col-12"
    [visible]="isVisible['tenant']"
    label="identity.user.form-group.tenant"
    [provider]="tenantProvider"
  />
  <div class="form-layout-col-lg-6 form-layout-col-12">Hola vamos a ver que configura.</div>
  <editable-text formControlName="name" [visible]="isVisible['name']" label="identity.user.form-group.name" />
  <editable-password
    formControlName="password"
    [visible]="isVisible['password']"
    label="identity.user.form-group.password"
  />
  <editable-text formControlName="email" [visible]="isVisible['email']" label="identity.user.form-group.email" />
  <mat-expansion-panel
    class="form-layout-col-xs-12 form-layout-row-3 form-layout-col-10"
    [expanded]="true"
    class="form-layout-col-xs-12 form-layout-row-3 form-layout-col-10"
  >
    <mat-expansion-panel-header>
      <mat-panel-title> {{ 'nombre' | transloco }} </mat-panel-title>
    </mat-expansion-panel-header>
    <form-layout>
      <editable-check
        formControlName="enabled"
        [visible]="isVisible['enabled']"
        label="identity.user.form-group.enabled"
      />
      <editable-datetime
        formControlName="welcomeAt"
        [visible]="isVisible['welcomeAt']"
        label="identity.user.form-group.welcome-at"
      />
      <editable-datetime
        formControlName="blockedUntil"
        [visible]="isVisible['blockedUntil']"
        label="identity.user.form-group.blocked-until"
      />
    </form-layout>
  </mat-expansion-panel>
  <editable-check
    formControlName="useSecondFactors"
    class="form-layout-col-xs-12 form-layout-col-2"
    [visible]="isVisible['useSecondFactors']"
    label="identity.user.form-group.use-second-factors"
  />
  <editable-check
    formControlName="temporalPassword"
    class="form-layout-col-xs-12 form-layout-col-2"
    [visible]="isVisible['temporalPassword']"
    label="identity.user.form-group.temporal-password"
  />
  <editable-check
    formControlName="emailVerified"
    [visible]="isVisible['emailVerified']"
    label="identity.user.form-group.email-verified"
  />
  <editable-choose
    formControlName="approvalStatus"
    [visible]="isVisible['approvalStatus']"
    label="identity.user.form-group.approval-status"
    [options]="['UNVERIFIED', 'PENDING', 'ACCEPTED', 'REJECTED']"
  />
  <editable-text
    formControlName="federatedProvider"
    [visible]="isVisible['federatedProvider']"
    label="identity.user.form-group.federated-provider"
  />
</form-layout>
