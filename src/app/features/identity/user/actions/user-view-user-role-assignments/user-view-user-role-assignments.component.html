<ng-template #formTemplate>
  @if (!!this.selection().length) {
    <!-- Desde el usuario: la columna "usuario" sobra (va fija) y cada tarjeta destaca a qué servidor/cliente da acceso -->
    <user-role-assignment-view-list
      class="main"
      [filters]="{ users: selection()[0]?.uid }"
      [fixed]="{ user: { $ref: selection()[0]?.uid } }"
    >
      <list-view-row>
        <ng-template listViewRowTitle let-row="$implicit">
          {{ row.resourceServer()?.code ?? row.uid }}
        </ng-template>
        <ng-template listViewRowSubtitle let-row="$implicit">
          {{ row.oauthClient()?.code }}
        </ng-template>
      </list-view-row>
    </user-role-assignment-view-list>
  }
</ng-template>
