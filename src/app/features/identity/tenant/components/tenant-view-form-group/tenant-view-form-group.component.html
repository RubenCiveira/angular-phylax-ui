<!-- @autogenerated -->
<form-layout [formGroup]="form" style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4">
  <editable-text
    formControlName="name"
    class="form-layout-col-md-6 form-layout-col-12"
    [visible]="isVisible['name']"
    label="identity/tenant.form-group.name"
  />
  <editable-text
    formControlName="domain"
    class="form-layout-col-md-6 form-layout-col-12"
    [visible]="isVisible['domain']"
    label="identity/tenant.form-group.domain"
  />
  <editable-check
    formControlName="root"
    class="form-layout-col-12"
    [visible]="isVisible['root']"
    label="identity/tenant.form-group.root"
  />
  <mat-expansion-panel class="form-layout-col-12" [expanded]="false">
    <mat-expansion-panel-header>
      <mat-panel-title>{{ 'identity/tenant.form-group.layout.status' | transloco }}</mat-panel-title>
    </mat-expansion-panel-header>
    <form-layout>
      <editable-check
        formControlName="enabled"
        class="form-layout-col-md-4 form-layout-col-12"
        [visible]="isVisible['enabled']"
        label="identity/tenant.form-group.enabled"
      />
      <editable-check
        formControlName="markForDelete"
        class="form-layout-col-md-4 form-layout-col-12"
        [visible]="isVisible['markForDelete']"
        label="identity/tenant.form-group.mark-for-delete"
      />
      <editable-datetime
        formControlName="markForDeleteTime"
        class="form-layout-col-md-4 form-layout-col-12"
        [visible]="isVisible['markForDeleteTime']"
        label="identity/tenant.form-group.mark-for-delete-time"
      />
    </form-layout>
  </mat-expansion-panel>
</form-layout>
