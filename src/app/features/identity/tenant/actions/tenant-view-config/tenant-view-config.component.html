<!-- @autogenerated -->
<ng-template #formTemplate>
  <div class="panel">
    <tenant-config-view-form-group
      class="main"
      #formView
      [formControl]="form"
      [fixed]="fixedProperties()"
      [hidden]="hiddenProperties()"
      [defined]="definedProperties()"
    />
    <div class="buttons">
      <button mat-raised-button [disabled]="formView.form.invalid || !formView.form.dirty" (click)="save()">
        {{ 'identity/tenant.action.config.saveBtn' | transloco }}
      </button>
    </div>
  </div>
</ng-template>
