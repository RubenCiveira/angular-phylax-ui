<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="themes"
    [visible]="isVisible['themes']"
    label="document.theme-version.search.themes"
    [provider]="themesProvider"
  />
  <editable-text
    formControlName="search"
    [visible]="isVisible['search']"
    label="document.theme-version.search.search"
  />
  <editable-selectone
    formControlName="theme"
    [visible]="isVisible['theme']"
    label="document.theme-version.search.theme"
    [provider]="themeProvider"
  />
</form-layout>
