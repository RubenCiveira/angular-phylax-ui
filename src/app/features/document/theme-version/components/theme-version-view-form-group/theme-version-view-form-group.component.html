<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="theme"
    [visible]="isVisible['theme']"
    label="document.theme-version.form-group.theme"
    [provider]="themeProvider"
  />
  <editable-choose
    formControlName="channel"
    [visible]="isVisible['channel']"
    label="document.theme-version.form-group.channel"
    [options]="['MAIL', 'HTML']"
  />
  <editable-text
    formControlName="locale"
    [visible]="isVisible['locale']"
    label="document.theme-version.form-group.locale"
  />
  <editable-textarea
    formControlName="contentHtml"
    [visible]="isVisible['contentHtml']"
    label="document.theme-version.form-group.content-html"
  />
  <editable-textarea
    formControlName="contentText"
    [visible]="isVisible['contentText']"
    label="document.theme-version.form-group.content-text"
  />
</form-layout>
