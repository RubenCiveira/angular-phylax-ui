<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="snippet"
    [visible]="isVisible['snippet']"
    label="document.snippet-asset.search.snippet"
    [provider]="snippetProvider"
  />
  <editable-text
    formControlName="search"
    [visible]="isVisible['search']"
    label="document.snippet-asset.search.search"
  />
  <editable-text formControlName="code" [visible]="isVisible['code']" label="document.snippet-asset.search.code" />
  <editable-selectone
    formControlName="snippets"
    [visible]="isVisible['snippets']"
    label="document.snippet-asset.search.snippets"
    [provider]="snippetsProvider"
  />
  <editable-choose
    formControlName="order"
    [visible]="isVisible['order']"
    label="document.snippet-asset.search.order"
    [options]="['', 'CODE-ASC', 'CODE-DESC']"
  />
</form-layout>
