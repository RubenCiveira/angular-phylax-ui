<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="template"
    [visible]="isVisible['template']"
    label="document.template-asset.search.template"
    [provider]="templateProvider"
  />
  <editable-selectone
    formControlName="tenants"
    [visible]="isVisible['tenants']"
    label="document.template-asset.search.tenants"
    [provider]="tenantsProvider"
  />
  <editable-text
    formControlName="search"
    [visible]="isVisible['search']"
    label="document.template-asset.search.search"
  />
  <editable-text formControlName="code" [visible]="isVisible['code']" label="document.template-asset.search.code" />
  <editable-selectone
    formControlName="templates"
    [visible]="isVisible['templates']"
    label="document.template-asset.search.templates"
    [provider]="templatesProvider"
  />
  <editable-selectone
    formControlName="tenant"
    [visible]="isVisible['tenant']"
    label="document.template-asset.search.tenant"
    [provider]="tenantProvider"
  />
  <editable-choose
    formControlName="order"
    [visible]="isVisible['order']"
    label="document.template-asset.search.order"
    [options]="['', 'CODE-ASC', 'CODE-DESC']"
  />
</form-layout>
