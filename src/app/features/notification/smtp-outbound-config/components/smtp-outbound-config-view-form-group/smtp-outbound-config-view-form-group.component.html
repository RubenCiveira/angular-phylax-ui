<!-- @autogenerated -->
<form-layout

  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="tenant"
    [visible]="isVisible['tenant']"
    label="notification.smtp-outbound-config.form-group.tenant"
    [provider]="tenantProvider"
  />
  <editable-text
    formControlName="host"
    [visible]="isVisible['host']"
    label="notification.smtp-outbound-config.form-group.host"
  />
  <editable-integer
    formControlName="port"
    [visible]="isVisible['port']"
    label="notification.smtp-outbound-config.form-group.port"
  />
  <editable-text
    formControlName="login"
    [visible]="isVisible['login']"
    label="notification.smtp-outbound-config.form-group.login"
  />
  <editable-password
    formControlName="password"
    [visible]="isVisible['password']"
    label="notification.smtp-outbound-config.form-group.password"
  />
  <editable-text
    formControlName="senderName"
    [visible]="isVisible['senderName']"
    label="notification.smtp-outbound-config.form-group.sender-name"
  />
  <editable-text
    formControlName="senderEmail"
    [visible]="isVisible['senderEmail']"
    label="notification.smtp-outbound-config.form-group.sender-email"
  />
  <editable-integer
    formControlName="timeout"
    [visible]="isVisible['timeout']"
    label="notification.smtp-outbound-config.form-group.timeout"
  />
  <editable-check
    formControlName="useTls"
    [visible]="isVisible['useTls']"
    label="notification.smtp-outbound-config.form-group.use-tls"
  />
  <editable-integer
    formControlName="maxRetries"
    [visible]="isVisible['maxRetries']"
    label="notification.smtp-outbound-config.form-group.max-retries"
  />
  <editable-integer
    formControlName="retryDelay"
    [visible]="isVisible['retryDelay']"
    label="notification.smtp-outbound-config.form-group.retry-delay"
  />
  <editable-integer
    formControlName="rateLimit"
    [visible]="isVisible['rateLimit']"
    label="notification.smtp-outbound-config.form-group.rate-limit"
  />
</form-layout>
