<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-text
    formControlName="target"
    [visible]="isVisible['target']"
    label="notification.message.form-group.target"
  />
  <editable-selectone
    formControlName="tenant"
    [visible]="isVisible['tenant']"
    label="notification.message.form-group.tenant"
    [provider]="tenantProvider"
  />
  <editable-check
    formControlName="urgent"
    [visible]="isVisible['urgent']"
    label="notification.message.form-group.urgent"
  />
  <editable-textarea
    formControlName="content"
    [visible]="isVisible['content']"
    label="notification.message.form-group.content"
  />
  <editable-integer
    formControlName="retries"
    [visible]="isVisible['retries']"
    label="notification.message.form-group.retries"
  />
  <editable-datetime
    formControlName="createdAt"
    [visible]="isVisible['createdAt']"
    label="notification.message.form-group.created-at"
  />
  <editable-datetime
    formControlName="sendAt"
    [visible]="isVisible['sendAt']"
    label="notification.message.form-group.send-at"
  />
  <editable-datetime
    formControlName="lockAt"
    [visible]="isVisible['lockAt']"
    label="notification.message.form-group.lock-at"
  />
</form-layout>
