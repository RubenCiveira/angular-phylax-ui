<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-text
    formControlName="search"
    [visible]="isVisible['search']"
    label="access.user-role-assignament.search.search"
  />
  <editable-selectone
    formControlName="trustedClients"
    [visible]="isVisible['trustedClients']"
    label="access.user-role-assignament.search.trusted-clients"
    [provider]="trustedClientsProvider"
  />
  <editable-selectone
    formControlName="relyingPartys"
    [visible]="isVisible['relyingPartys']"
    label="access.user-role-assignament.search.relying-partys"
    [provider]="relyingPartysProvider"
  />
  <editable-selectone
    formControlName="relyingParty"
    [visible]="isVisible['relyingParty']"
    label="access.user-role-assignament.search.relying-party"
    [provider]="relyingPartyProvider"
  />
  <editable-selectone
    formControlName="trustedClient"
    [visible]="isVisible['trustedClient']"
    label="access.user-role-assignament.search.trusted-client"
    [provider]="trustedClientProvider"
  />
  <editable-selectone
    formControlName="user"
    [visible]="isVisible['user']"
    label="access.user-role-assignament.search.user"
    [provider]="userProvider"
  />
  <editable-selectone
    formControlName="users"
    [visible]="isVisible['users']"
    label="access.user-role-assignament.search.users"
    [provider]="usersProvider"
  />
</form-layout>
