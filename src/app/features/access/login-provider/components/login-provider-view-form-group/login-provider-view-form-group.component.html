<!-- @autogenerated -->
<form-layout [formGroup]="form">
  <editable-selectone
    *ngIf="isVisible['tenant']"
    formControlName="tenant"
    label="access.login-provider.form-group.tenant"
    [provider]="tenantProvider"
  />
  <editable-text *ngIf="isVisible['name']" formControlName="name" label="access.login-provider.form-group.name" />
  <editable-choose
    *ngIf="isVisible['source']"
    formControlName="source"
    label="access.login-provider.form-group.source"
    [options]="['google', 'github', 'saml']"
  />
  <editable-check
    *ngIf="isVisible['disabled']"
    formControlName="disabled"
    label="access.login-provider.form-group.disabled"
  />
  <editable-check
    *ngIf="isVisible['directAccess']"
    formControlName="directAccess"
    label="access.login-provider.form-group.direct-access"
  />
  <editable-text
    *ngIf="isVisible['publicKey']"
    formControlName="publicKey"
    label="access.login-provider.form-group.public-key"
  />
  <editable-text
    *ngIf="isVisible['privateKey']"
    formControlName="privateKey"
    label="access.login-provider.form-group.private-key"
  />
  <editable-text
    *ngIf="isVisible['certificate']"
    formControlName="certificate"
    label="access.login-provider.form-group.certificate"
  />
  <editable-upload
    *ngIf="isVisible['metadata']"
    formControlName="metadata"
    label="access.login-provider.form-group.metadata"
    [download]="downloadMetadata"
    [upload]="uploadMetadata"
  />
  <editable-check
    *ngIf="isVisible['usersEnabledByDefault']"
    formControlName="usersEnabledByDefault"
    label="access.login-provider.form-group.users-enabled-by-default"
  />
</form-layout>
