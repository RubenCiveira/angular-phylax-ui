<!-- @autogenerated -->
<form-layout [formGroup]="form">
  @if (isVisible['tenants']) {
    <editable-selectone
      formControlName="tenants"
      label="access.login-provider.search.tenants"
      [provider]="tenantsProvider"
    />
  }
  @if (isVisible['search']) {
    <editable-text formControlName="search" label="access.login-provider.search.search" />
  }
  @if (isVisible['name']) {
    <editable-text formControlName="name" label="access.login-provider.search.name" />
  }
  @if (isVisible['tenant']) {
    <editable-selectone
      formControlName="tenant"
      label="access.login-provider.search.tenant"
      [provider]="tenantProvider"
    />
  }
  @if (isVisible['order']) {
    <editable-choose
      formControlName="order"
      label="access.login-provider.search.order"
      [options]="['', 'NAME-ASC', 'NAME-DESC']"
    />
  }
</form-layout>
