<!-- @autogenerated -->
<form-layout [formGroup]="form">
  @if (isVisible['tenant']) {
    <editable-selectone
      formControlName="tenant"
      label="access.tenant-config.form-group.tenant"
      [provider]="tenantProvider"
    />
  }
  @if (isVisible['innerLabel']) {
    <editable-text formControlName="innerLabel" label="access.tenant-config.form-group.inner-label" />
  }
  @if (isVisible['forceMfa']) {
    <editable-check formControlName="forceMfa" label="access.tenant-config.form-group.force-mfa" />
  }
</form-layout>
