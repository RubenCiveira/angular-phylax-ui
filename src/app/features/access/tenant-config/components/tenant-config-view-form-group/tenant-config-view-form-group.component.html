<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="tenant"
    [visible]="isVisible['tenant']"
    label="access.tenant-config.form-group.tenant"
    [provider]="tenantProvider"
  />
  <editable-text
    formControlName="innerLabel"
    [visible]="isVisible['innerLabel']"
    label="access.tenant-config.form-group.inner-label"
  />
  <editable-check
    formControlName="forceMfa"
    [visible]="isVisible['forceMfa']"
    label="access.tenant-config.form-group.force-mfa"
  />
  <editable-choose
    formControlName="dynamicRegistrationPolicy"
    [visible]="isVisible['dynamicRegistrationPolicy']"
    label="access.tenant-config.form-group.dynamic-registration-policy"
    [options]="['OPEN', 'TOKEN-REQUIRED', 'DISABLED']"
  />
  <editable-check
    formControlName="allowRegister"
    [visible]="isVisible['allowRegister']"
    label="access.tenant-config.form-group.allow-register"
  />
  <editable-check
    formControlName="enableRegisterUsers"
    [visible]="isVisible['enableRegisterUsers']"
    label="access.tenant-config.form-group.enable-register-users"
  />
  <editable-check
    formControlName="magicLinkEnabled"
    [visible]="isVisible['magicLinkEnabled']"
    label="access.tenant-config.form-group.magic-link-enabled"
  />
  <editable-check
    formControlName="requireEmailVerification"
    [visible]="isVisible['requireEmailVerification']"
    label="access.tenant-config.form-group.require-email-verification"
  />
  <editable-integer
    formControlName="invitationExpiryDays"
    [visible]="isVisible['invitationExpiryDays']"
    label="access.tenant-config.form-group.invitation-expiry-days"
  />
  <editable-integer
    formControlName="magicLinkExpiryMinutes"
    [visible]="isVisible['magicLinkExpiryMinutes']"
    label="access.tenant-config.form-group.magic-link-expiry-minutes"
  />
  <editable-integer
    formControlName="sessionSsoTtlSeconds"
    [visible]="isVisible['sessionSsoTtlSeconds']"
    label="access.tenant-config.form-group.session-sso-ttl-seconds"
  />
  <editable-integer
    formControlName="refreshTokenTtlSeconds"
    [visible]="isVisible['refreshTokenTtlSeconds']"
    label="access.tenant-config.form-group.refresh-token-ttl-seconds"
  />
  <editable-check
    formControlName="webauthnEnabled"
    [visible]="isVisible['webauthnEnabled']"
    label="access.tenant-config.form-group.webauthn-enabled"
  />
  <editable-text
    formControlName="webauthnRpId"
    [visible]="isVisible['webauthnRpId']"
    label="access.tenant-config.form-group.webauthn-rp-id"
  />
  <editable-text
    formControlName="webauthnRpName"
    [visible]="isVisible['webauthnRpName']"
    label="access.tenant-config.form-group.webauthn-rp-name"
  />
  <editable-textarea
    formControlName="wellcomeEmail"
    [visible]="isVisible['wellcomeEmail']"
    label="access.tenant-config.form-group.wellcome-email"
  />
  <editable-textarea
    formControlName="registerdEmail"
    [visible]="isVisible['registerdEmail']"
    label="access.tenant-config.form-group.registerd-email"
  />
  <editable-textarea
    formControlName="disabledUserEmail"
    [visible]="isVisible['disabledUserEmail']"
    label="access.tenant-config.form-group.disabled-user-email"
  />
  <editable-textarea
    formControlName="enabledUserEmail"
    [visible]="isVisible['enabledUserEmail']"
    label="access.tenant-config.form-group.enabled-user-email"
  />
  <editable-check
    formControlName="allowRecoverPass"
    [visible]="isVisible['allowRecoverPass']"
    label="access.tenant-config.form-group.allow-recover-pass"
  />
  <editable-textarea
    formControlName="recoverPassEmail"
    [visible]="isVisible['recoverPassEmail']"
    label="access.tenant-config.form-group.recover-pass-email"
  />
</form-layout>
