<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="tenants"
    [visible]="isVisible['tenants']"
    label="access.tenant-config.search.tenants"
    [provider]="tenantsProvider"
  />
  <editable-text formControlName="search" [visible]="isVisible['search']" label="access.tenant-config.search.search" />
  <editable-selectone
    formControlName="tenant"
    [visible]="isVisible['tenant']"
    label="access.tenant-config.search.tenant"
    [provider]="tenantProvider"
  />
</form-layout>
