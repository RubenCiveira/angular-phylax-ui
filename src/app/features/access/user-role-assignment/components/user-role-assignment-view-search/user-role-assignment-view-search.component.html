<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-text
    formControlName="search"
    [visible]="isVisible['search']"
    label="access.user-role-assignment.search.search"
  />
  <editable-selectone
    formControlName="oauthClient"
    [visible]="isVisible['oauthClient']"
    label="access.user-role-assignment.search.oauth-client"
    [provider]="oauthClientProvider"
  />
  <editable-selectone
    formControlName="resourceServer"
    [visible]="isVisible['resourceServer']"
    label="access.user-role-assignment.search.resource-server"
    [provider]="resourceServerProvider"
  />
  <editable-selectone
    formControlName="oauthClients"
    [visible]="isVisible['oauthClients']"
    label="access.user-role-assignment.search.oauth-clients"
    [provider]="oauthClientsProvider"
  />
  <editable-selectone
    formControlName="user"
    [visible]="isVisible['user']"
    label="access.user-role-assignment.search.user"
    [provider]="userProvider"
  />
  <editable-selectone
    formControlName="users"
    [visible]="isVisible['users']"
    label="access.user-role-assignment.search.users"
    [provider]="usersProvider"
  />
  <editable-selectone
    formControlName="resourceServers"
    [visible]="isVisible['resourceServers']"
    label="access.user-role-assignment.search.resource-servers"
    [provider]="resourceServersProvider"
  />
</form-layout>
