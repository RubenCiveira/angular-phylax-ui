<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="user"
    [visible]="isVisible['user']"
    label="access.user-role-assignment.form-group.user"
    [provider]="userProvider"
  />
  <editable-selectone
    formControlName="resourceServer"
    [visible]="isVisible['resourceServer']"
    label="access.user-role-assignment.form-group.resource-server"
    [provider]="resourceServerProvider"
  />
  <editable-selectone
    formControlName="oauthClient"
    [visible]="isVisible['oauthClient']"
    label="access.user-role-assignment.form-group.oauth-client"
    [provider]="oauthClientProvider"
  />
  <editable-chips
    formControlName="roles"
    [visible]="isVisible['roles']"
    label="access.user-role-assignment.form-group.roles"
    [render]="rolesRender"
    [provider]="rolesProvider"
  />
</form-layout>
