<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-text formControlName="code" [visible]="isVisible['code']" label="access.api-key-client.form-group.code" />
  <editable-text formControlName="key" [visible]="isVisible['key']" label="access.api-key-client.form-group.key" />
  <editable-check
    formControlName="enabled"
    [visible]="isVisible['enabled']"
    label="access.api-key-client.form-group.enabled"
  />
  <editable-text
    formControlName="scopes"
    [visible]="isVisible['scopes']"
    label="access.api-key-client.form-group.scopes"
  />
</form-layout>
