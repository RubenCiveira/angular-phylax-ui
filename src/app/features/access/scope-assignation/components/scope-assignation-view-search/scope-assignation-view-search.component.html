    <editable-selectone
      formControlName="securityDomain"
      label="access.scope-assignation.search.security-domain"
      [provider]="securityDomainProvider"
    />
  }
  @if (isVisible['securityDomains']) {
    <editable-selectone

      label="access.scope-assignation.search.security-domains"
