<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-text formControlName="name" [visible]="isVisible['name']" label="access.role.form-group.name" />
  <editable-selectone
    formControlName="resourceServer"
    [visible]="isVisible['resourceServer']"
    label="access.role.form-group.resource-server"
    [provider]="resourceServerProvider"
  />
</form-layout>
