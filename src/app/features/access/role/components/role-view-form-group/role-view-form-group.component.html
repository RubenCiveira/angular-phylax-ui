<!-- @autogenerated -->
<form-layout [formGroup]="form">
  @if (isVisible['name']) {
    <editable-text formControlName="name" label="access.role.form-group.name" />
  }
  @if (isVisible['tenant']) {
    <editable-selectone formControlName="tenant" label="access.role.form-group.tenant" [provider]="tenantProvider" />
  }
  @if (isVisible['domains']) {
    <editable-chips
      formControlName="domains"
      label="access.role.form-group.domains"
      [render]="domainsRender"
      [provider]="domainsProvider"
    />
  }
</form-layout>
