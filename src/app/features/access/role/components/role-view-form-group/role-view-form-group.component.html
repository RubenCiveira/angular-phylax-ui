<form-layout [formGroup]="form">
  <editable-text *ngIf="isVisible['name']" formControlName="name" label="access.role.form-group.name" />
  <editable-selectone
    *ngIf="isVisible['tenant']"
    formControlName="tenant"
    label="access.role.form-group.tenant"
    [provider]="tenantProvider"
  />
  <editable-chips
    *ngIf="isVisible['domains']"
    formControlName="domains"
    label="access.role.form-group.domains"
    [render]="domainsRender"
    [provider]="domainsProvider"
  />
</form-layout>
