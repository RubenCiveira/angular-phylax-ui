<!-- @autogenerated -->
<form-layout [formGroup]="form" style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4">
  <editable-text formControlName="search" [visible]="isVisible['search']" label="access/role.search.search" />
  <editable-text formControlName="name" [visible]="isVisible['name']" label="access/role.search.name" />
  <editable-selectone
    formControlName="resourceServer"
    [visible]="isVisible['resourceServer']"
    label="access/role.search.resource-server"
    [provider]="resourceServerProvider"
  />
  <editable-selectone
    formControlName="resourceServers"
    [visible]="isVisible['resourceServers']"
    label="access/role.search.resource-servers"
    [provider]="resourceServersProvider"
  />
  <editable-choose
    formControlName="order"
    [visible]="isVisible['order']"
    label="access/role.search.order"
    [options]="['', 'NAME-ASC', 'NAME-DESC']"
  />
</form-layout>
