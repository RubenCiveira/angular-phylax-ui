<!-- @autogenerated -->
<form-layout [formGroup]="form">
  @if (isVisible['tenants']) {
    <editable-selectone formControlName="tenants" label="access.role.search.tenants" [provider]="tenantsProvider" />
  }
  @if (isVisible['search']) {
    <editable-text formControlName="search" label="access.role.search.search" />
  }
  @if (isVisible['name']) {
    <editable-text formControlName="name" label="access.role.search.name" />
  }
  @if (isVisible['tenant']) {
    <editable-selectone formControlName="tenant" label="access.role.search.tenant" [provider]="tenantProvider" />
  }
  @if (isVisible['order']) {
    <editable-choose
      formControlName="order"
      label="access.role.search.order"
      [options]="['', 'NAME-ASC', 'NAME-DESC']"
    />
  }
</form-layout>
