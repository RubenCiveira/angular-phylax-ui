<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-text formControlName="search" [visible]="isVisible['search']" label="access.role.search.search" />
  <editable-text formControlName="name" [visible]="isVisible['name']" label="access.role.search.name" />
  <editable-selectone
    formControlName="relyingPartys"
    [visible]="isVisible['relyingPartys']"
    label="access.role.search.relying-partys"
    [provider]="relyingPartysProvider"
  />
  <editable-selectone
    formControlName="relyingParty"
    [visible]="isVisible['relyingParty']"
    label="access.role.search.relying-party"
    [provider]="relyingPartyProvider"
  />
  <editable-choose
    formControlName="order"
    [visible]="isVisible['order']"
    label="access.role.search.order"
    [options]="['', 'NAME-ASC', 'NAME-DESC']"
  />
</form-layout>
