<form-layout [formGroup]="form">
  @if (isVisible['search']) {
    <editable-text formControlName="search" label="access.relying-party.search.search" />
  }
  @if (isVisible['code']) {
    <editable-text formControlName="code" label="access.relying-party.search.code" />
  }
  @if (isVisible['apiKey']) {
    <editable-text formControlName="apiKey" label="access.relying-party.search.api-key" />
  }
  @if (isVisible['order']) {
    <editable-choose
      formControlName="order"
      label="access.relying-party.search.order"
      [options]="['', 'CODE-ASC', 'CODE-DESC']"
    />
  }
</form-layout>
