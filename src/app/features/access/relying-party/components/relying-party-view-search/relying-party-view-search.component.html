<form-layout

  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-text formControlName="search" [visible]="isVisible['search']" label="access.relying-party.search.search" />
  <editable-text formControlName="code" [visible]="isVisible['code']" label="access.relying-party.search.code" />
  <editable-text formControlName="apiKey" [visible]="isVisible['apiKey']" label="access.relying-party.search.api-key" />

    [visible]="isVisible['order']"
    label="access.relying-party.search.order"
    [options]="['', 'CODE-ASC', 'CODE-DESC']"
  />
</form-layout>
