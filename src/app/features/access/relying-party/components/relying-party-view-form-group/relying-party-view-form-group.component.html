<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-text formControlName="code" [visible]="isVisible['code']" label="access.relying-party.form-group.code" />
  <editable-text
    formControlName="apiKey"
    [visible]="isVisible['apiKey']"
    label="access.relying-party.form-group.api-key"
  />
  <editable-check
    formControlName="enabled"
    [visible]="isVisible['enabled']"
    label="access.relying-party.form-group.enabled"
  />
</form-layout>
