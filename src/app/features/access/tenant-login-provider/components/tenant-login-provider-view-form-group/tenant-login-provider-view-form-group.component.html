<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="tenant"
    [visible]="isVisible['tenant']"
    label="access.tenant-login-provider.form-group.tenant"
    [provider]="tenantProvider"
  />
  <editable-text
    formControlName="name"
    [visible]="isVisible['name']"
    label="access.tenant-login-provider.form-group.name"
  />
  <editable-choose
    formControlName="source"
    [visible]="isVisible['source']"
    label="access.tenant-login-provider.form-group.source"
    [options]="['GOOGLE', 'GITHUB', 'MICROSOFT', 'APPLE', 'SAML', 'OIDC']"
  />
  <editable-check
    formControlName="disabled"
    [visible]="isVisible['disabled']"
    label="access.tenant-login-provider.form-group.disabled"
  />
  <editable-check
    formControlName="directAccess"
    [visible]="isVisible['directAccess']"
    label="access.tenant-login-provider.form-group.direct-access"
  />
  <editable-text
    formControlName="publicKey"
    [visible]="isVisible['publicKey']"
    label="access.tenant-login-provider.form-group.public-key"
  />
  <editable-text
    formControlName="privateKey"
    [visible]="isVisible['privateKey']"
    label="access.tenant-login-provider.form-group.private-key"
  />
  <editable-textarea
    formControlName="certificate"
    [visible]="isVisible['certificate']"
    label="access.tenant-login-provider.form-group.certificate"
  />
  <editable-upload
    formControlName="metadata"
    [visible]="isVisible['metadata']"
    label="access.tenant-login-provider.form-group.metadata"
    [download]="downloadMetadata"
    [upload]="uploadMetadata"
  />
  <editable-text
    formControlName="oidcDiscoveryUrl"
    [visible]="isVisible['oidcDiscoveryUrl']"
    label="access.tenant-login-provider.form-group.oidc-discovery-url"
  />
  <editable-text
    formControlName="samlIdpMetadataUrl"
    [visible]="isVisible['samlIdpMetadataUrl']"
    label="access.tenant-login-provider.form-group.saml-idp-metadata-url"
  />
  <editable-text
    formControlName="samlIdpEntityId"
    [visible]="isVisible['samlIdpEntityId']"
    label="access.tenant-login-provider.form-group.saml-idp-entity-id"
  />
  <editable-text
    formControlName="samlIdpSsoUrl"
    [visible]="isVisible['samlIdpSsoUrl']"
    label="access.tenant-login-provider.form-group.saml-idp-sso-url"
  />
  <editable-upload
    formControlName="samlIdpIdpCert"
    [visible]="isVisible['samlIdpIdpCert']"
    label="access.tenant-login-provider.form-group.saml-idp-idp-cert"
    [download]="downloadSamlIdpIdpCert"
    [upload]="uploadSamlIdpIdpCert"
  />
  <editable-check
    formControlName="usersEnabledByDefault"
    [visible]="isVisible['usersEnabledByDefault']"
    label="access.tenant-login-provider.form-group.users-enabled-by-default"
  />
</form-layout>
