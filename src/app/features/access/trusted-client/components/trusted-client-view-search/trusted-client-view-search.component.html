<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-text
    formControlName="withFrontChannelUrl"
    [visible]="isVisible['withFrontChannelUrl']"
    label="access.trusted-client.search.with-front-channel-url"
  />
  <editable-text formControlName="search" [visible]="isVisible['search']" label="access.trusted-client.search.search" />
  <editable-text formControlName="code" [visible]="isVisible['code']" label="access.trusted-client.search.code" />
  <editable-text
    formControlName="withBackChannelUrl"
    [visible]="isVisible['withBackChannelUrl']"
    label="access.trusted-client.search.with-back-channel-url"
  />
  <editable-choose
    formControlName="order"
    [visible]="isVisible['order']"
    label="access.trusted-client.search.order"
    [options]="['', 'CODE-ASC', 'CODE-DESC']"
  />
</form-layout>
