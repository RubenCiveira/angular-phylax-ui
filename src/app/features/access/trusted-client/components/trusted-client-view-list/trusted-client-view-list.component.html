<!-- @autogenerated -->
<trusted-client-view-standar-actions #actions [hidden]="hidden()" [fixed]="fixed()">
  <div
    *ngIf="actions.hasMultiple() && actions.hasSelection()"
    style="display: flex; flex-direction: row; padding: 10px 10px 0 10px; align-items: center"
  >
    <ng-container *ngTemplateOutlet="actions.theSelectionTemplate() || null"></ng-container>
  </div>
  <div
    *ngIf="!actions.hasMultiple() || !actions.hasSelection()"
    style="display: flex; flex-direction: row; padding: 10px 10px 0 10px; align-items: center"
  >
    <ng-container *ngTemplateOutlet="actions.theToolbarTemplate() || null"></ng-container>
    <div style="flex: 1"></div>
    <button mat-raised-button (click)="panel.toggle()">
      <mat-icon *ngIf="!panel.expanded">filter_list</mat-icon>
      <mat-icon *ngIf="panel.expanded">keyboard_arrow_up</mat-icon>
      {{ 'access.trusted-client.list.filter.button' | transloco }}
    </button>
    <button mat-raised-button (click)="reload()">
      <mat-icon>refresh</mat-icon>
    </button>
  </div>
  <mat-expansion-panel #panel style="margin: 10px">
    <!-- Formulario de filtros -->
    <h2>{{ 'access.trusted-client.list.search.title' | transloco }}</h2>
    <trusted-client-view-search #searchForm [formControl]="search" />
    <button mat-raised-button [disabled]="searchForm.form.invalid || !searchForm.form.dirty" (click)="makeSearch()">
      {{ 'access.trusted-client.list.search.button' | transloco }}
    </button>
  </mat-expansion-panel>
  <div class="main">
    <div *ngIf="!list.searching() && list()?.length == 0">
      <h1>No content</h1>
    </div>
    <list-view
      [searching]="list.searching()"
      [data]="list()"
      (next)="next()"
      (prev)="prev()"
      (activate)="actions.defaultAction([$event])"
      [selectionMultiple]="!!actions.hasMultiple()"
      [selectionModel]="actions.selectionModel"
    >
      <list-view-row>
        <ng-template listViewRowTitle let-row="$implicit">
          {{ row.code }}
        </ng-template>
        <ng-template listViewRowAction let-row="$implicit">
          <ng-container
            *ngTemplateOutlet="actions.theContextTemplate() || null; context: { row: row, key: row.uid }"
          ></ng-container>
        </ng-template>
      </list-view-row>
      <list-view-table>
        <ng-template
          listViewColumn
          title="{{ 'access.trusted-client.list.column.code.title' | transloco }}"
          tooltip="{{ 'access.trusted-client.list.column.code.tooltip' | transloco }}"
          let-row="$implicit"
        >
          {{ row.code }}
        </ng-template>
        <ng-template
          listViewColumn
          title="{{ 'access.trusted-client.list.column.public-allow.title' | transloco }}"
          tooltip="{{ 'access.trusted-client.list.column.public-allow.tooltip' | transloco }}"
          let-row="$implicit"
        >
          {{ row.publicAllow }}
        </ng-template>
        <ng-template
          listViewColumn
          title="{{ 'access.trusted-client.list.column.secret-oauth.title' | transloco }}"
          tooltip="{{ 'access.trusted-client.list.column.secret-oauth.tooltip' | transloco }}"
          let-row="$implicit"
        >
          {{ row.secretOauth }}
        </ng-template>
        <ng-template
          listViewColumn
          title="{{ 'access.trusted-client.list.column.allowed-redirects.title' | transloco }}"
          tooltip="{{ 'access.trusted-client.list.column.allowed-redirects.tooltip' | transloco }}"
          let-row="$implicit"
        >
          {{ row.allowedRedirects }}
        </ng-template>
        <ng-template
          listViewColumn
          title="{{ 'access.trusted-client.list.column.enabled.title' | transloco }}"
          tooltip="{{ 'access.trusted-client.list.column.enabled.tooltip' | transloco }}"
          let-row="$implicit"
        >
          {{ row.enabled }}
        </ng-template>
        <ng-template listViewColumn let-row="$implicit">
          <ng-container
            *ngTemplateOutlet="actions.theContextTemplate() || null; context: { row: row, key: row.uid }"
          ></ng-container>
        </ng-template>
      </list-view-table>
    </list-view>
  </div>
</trusted-client-view-standar-actions>
