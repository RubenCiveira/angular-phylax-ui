<!-- @autogenerated -->
<form-layout [formGroup]="form">
  @if (isVisible['code']) {
    <editable-text formControlName="code" label="access.trusted-client.form-group.code" />
  }
  @if (isVisible['publicAllow']) {
    <editable-check formControlName="publicAllow" label="access.trusted-client.form-group.public-allow" />
  }
  @if (isVisible['secretOauth']) {
    <editable-password formControlName="secretOauth" label="access.trusted-client.form-group.secret-oauth" />
  }
  @if (isVisible['allowedRedirects']) {
    <editable-text formControlName="allowedRedirects" label="access.trusted-client.form-group.allowed-redirects" />
  }
  @if (isVisible['enabled']) {
    <editable-check formControlName="enabled" label="access.trusted-client.form-group.enabled" />
  }
</form-layout>
