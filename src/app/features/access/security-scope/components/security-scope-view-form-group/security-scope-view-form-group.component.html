<!-- @autogenerated -->
<form-layout [formGroup]="form">
  <editable-selectone
    *ngIf="isVisible['trustedClient']"
    formControlName="trustedClient"
    label="access.security-scope.form-group.trusted-client"
    [provider]="trustedClientProvider"
  />
  <editable-selectone
    *ngIf="isVisible['relyingParty']"
    formControlName="relyingParty"
    label="access.security-scope.form-group.relying-party"
    [provider]="relyingPartyProvider"
  />
  <editable-text
    *ngIf="isVisible['resource']"
    formControlName="resource"
    label="access.security-scope.form-group.resource"
  />
  <editable-text *ngIf="isVisible['scope']" formControlName="scope" label="access.security-scope.form-group.scope" />
  <editable-text *ngIf="isVisible['kind']" formControlName="kind" label="access.security-scope.form-group.kind" />
  <editable-choose
    *ngIf="isVisible['visibility']"
    formControlName="visibility"
    label="access.security-scope.form-group.visibility"
    [options]="['public', 'authorized', 'explicit']"
  />
</form-layout>
