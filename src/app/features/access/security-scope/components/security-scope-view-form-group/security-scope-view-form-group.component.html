<!-- @autogenerated -->
<form-layout [formGroup]="form">
  @if (isVisible['trustedClient']) {
    <editable-selectone
      formControlName="trustedClient"
      label="access.security-scope.form-group.trusted-client"
      [provider]="trustedClientProvider"
    />
  }
  @if (isVisible['relyingParty']) {
    <editable-selectone
      formControlName="relyingParty"
      label="access.security-scope.form-group.relying-party"
      [provider]="relyingPartyProvider"
    />
  }
  @if (isVisible['resource']) {
    <editable-text formControlName="resource" label="access.security-scope.form-group.resource" />
  }
  @if (isVisible['scope']) {
    <editable-text formControlName="scope" label="access.security-scope.form-group.scope" />
  }
  @if (isVisible['enabled']) {
    <editable-check formControlName="enabled" label="access.security-scope.form-group.enabled" />
  }
  @if (isVisible['kind']) {
    <editable-choose
      formControlName="kind"
      label="access.security-scope.form-group.kind"
      [options]="['READ', 'WRITE', 'MANAGE']"
    />
  }
  @if (isVisible['visibility']) {
    <editable-choose
      formControlName="visibility"
      label="access.security-scope.form-group.visibility"
      [options]="['PUBLIC', 'AUTHORIZED', 'EXPLICIT']"
    />
  }
</form-layout>
