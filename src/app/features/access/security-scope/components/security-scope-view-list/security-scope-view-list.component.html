<!-- @autogenerated -->
<security-scope-view-standar-actions #actions [hidden]="hidden()" [fixed]="fixed()">
  <div class="table-toolbar">
    <div
      *ngIf="actions.hasMultiple() && actions.hasSelection()"
      style="display: flex; flex-direction: row; padding: 10px 10px 0 10px; align-items: center"
    >
      <ng-container *ngTemplateOutlet="actions.theSelectionTemplate() || null"></ng-container>
    </div>
    <div
      *ngIf="!actions.hasMultiple() || !actions.hasSelection()"
      style="display: flex; flex-direction: row; padding: 10px 10px 0 10px; align-items: center"
    >
      <ng-container *ngTemplateOutlet="actions.theToolbarTemplate() || null"></ng-container>
      <div style="flex: 1"></div>
      <button mat-raised-button (click)="panel.toggle()">
        <mat-icon *ngIf="!panel.expanded">filter_list</mat-icon>
        <mat-icon *ngIf="panel.expanded">keyboard_arrow_up</mat-icon>
        {{ 'access.security-scope.list.filter.button' | transloco }}
      </button>
      <button mat-raised-button (click)="reload()">
        <mat-icon>refresh</mat-icon>
      </button>
    </div>
    <mat-expansion-panel #panel style="margin: 10px">
      <!-- Formulario de filtros -->
      <h2>{{ 'access.security-scope.list.search.title' | transloco }}</h2>
      <security-scope-view-search #searchForm [formControl]="search" />
      <button mat-raised-button [disabled]="searchForm.form.invalid || !searchForm.form.dirty" (click)="makeSearch()">
        {{ 'access.security-scope.list.search.button' | transloco }}
      </button>
    </mat-expansion-panel>
  </div>
  <div class="main">
    <div *ngIf="!list.searching() && list()?.length == 0">
      <h1>No content</h1>
    </div>
    <list-view
      [searching]="list.searching()"
      [data]="list()"
      (next)="next()"
      (prev)="prev()"
      (activate)="actions.defaultAction([$event])"
      [selectionMultiple]="!!actions.hasMultiple()"
      [selectionModel]="actions.selectionModel"
    >
      <list-view-row>
        <ng-template listViewRowTitle let-row="$implicit">
          {{ row.uid }}
        </ng-template>
        <ng-template listViewRowAction let-row="$implicit">
          <ng-container
            *ngTemplateOutlet="actions.theContextTemplate() || null; context: { row: row, key: row.uid }"
          ></ng-container>
        </ng-template>
      </list-view-row>
      <list-view-table>
        <ng-template
          listViewColumn
          title="{{ 'access.security-scope.list.column.trusted-client.title' | transloco }}"
          tooltip="{{ 'access.security-scope.list.column.trusted-client.tooltip' | transloco }}"
          let-row="$implicit"
        >
          {{ row.trustedClient()?.code }}
        </ng-template>
        <ng-template
          listViewColumn
          title="{{ 'access.security-scope.list.column.relying-party.title' | transloco }}"
          tooltip="{{ 'access.security-scope.list.column.relying-party.tooltip' | transloco }}"
          let-row="$implicit"
        >
          {{ row.relyingParty()?.code }}
        </ng-template>
        <ng-template
          listViewColumn
          title="{{ 'access.security-scope.list.column.resource.title' | transloco }}"
          tooltip="{{ 'access.security-scope.list.column.resource.tooltip' | transloco }}"
          let-row="$implicit"
        >
          {{ row.resource }}
        </ng-template>
        <ng-template
          listViewColumn
          title="{{ 'access.security-scope.list.column.scope.title' | transloco }}"
          tooltip="{{ 'access.security-scope.list.column.scope.tooltip' | transloco }}"
          let-row="$implicit"
        >
          {{ row.scope }}
        </ng-template>
        <ng-template
          listViewColumn
          title="{{ 'access.security-scope.list.column.enabled.title' | transloco }}"
          tooltip="{{ 'access.security-scope.list.column.enabled.tooltip' | transloco }}"
          let-row="$implicit"
        >
          {{ row.enabled }}
        </ng-template>
        <ng-template
          listViewColumn
          title="{{ 'access.security-scope.list.column.kind.title' | transloco }}"
          tooltip="{{ 'access.security-scope.list.column.kind.tooltip' | transloco }}"
          let-row="$implicit"
        >
          {{ row.kind }}
        </ng-template>
        <ng-template
          listViewColumn
          title="{{ 'access.security-scope.list.column.visibility.title' | transloco }}"
          tooltip="{{ 'access.security-scope.list.column.visibility.tooltip' | transloco }}"
          let-row="$implicit"
        >
          {{ row.visibility }}
        </ng-template>
        <ng-template listViewColumn let-row="$implicit">
          <ng-container
            *ngTemplateOutlet="actions.theContextTemplate() || null; context: { row: row, key: row.uid }"
          ></ng-container>
        </ng-template>
      </list-view-table>
    </list-view>
  </div>
</security-scope-view-standar-actions>
