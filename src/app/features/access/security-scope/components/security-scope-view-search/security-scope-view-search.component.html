<!-- @autogenerated -->
<form-layout [formGroup]="form">
  @if (isVisible['search']) {
    <editable-text formControlName="search" label="access.security-scope.search.search" />
  }
  @if (isVisible['resource']) {
    <editable-text formControlName="resource" label="access.security-scope.search.resource" />
  }
  @if (isVisible['trustedClients']) {
    <editable-selectone
      formControlName="trustedClients"
      label="access.security-scope.search.trusted-clients"
      [provider]="trustedClientsProvider"
    />
  }
  @if (isVisible['relyingPartys']) {
    <editable-selectone
      formControlName="relyingPartys"
      label="access.security-scope.search.relying-partys"
      [provider]="relyingPartysProvider"
    />
  }
  @if (isVisible['trustedClient']) {
    <editable-selectone
      formControlName="trustedClient"
      label="access.security-scope.search.trusted-client"
      [provider]="trustedClientProvider"
    />
  }
  @if (isVisible['relyingParty']) {
    <editable-selectone
      formControlName="relyingParty"
      label="access.security-scope.search.relying-party"
      [provider]="relyingPartyProvider"
    />
  }
</form-layout>
