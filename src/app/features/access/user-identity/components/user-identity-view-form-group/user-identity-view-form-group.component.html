<!-- @autogenerated -->
<form-layout [formGroup]="form">
  @if (isVisible['user']) {
    <editable-selectone formControlName="user" label="access.user-identity.form-group.user" [provider]="userProvider" />
  }
  @if (isVisible['relyingParty']) {
    <editable-selectone
      formControlName="relyingParty"
      label="access.user-identity.form-group.relying-party"
      [provider]="relyingPartyProvider"
    />
  }
  @if (isVisible['trustedClient']) {
    <editable-selectone
      formControlName="trustedClient"
      label="access.user-identity.form-group.trusted-client"
      [provider]="trustedClientProvider"
    />
  }
  @if (isVisible['roles']) {
    <editable-chips
      formControlName="roles"
      label="access.user-identity.form-group.roles"
      [render]="rolesRender"
      [provider]="rolesProvider"
    />
  }
</form-layout>
