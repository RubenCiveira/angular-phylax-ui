<!-- @autogenerated -->
<form-layout [formGroup]="form">
  @if (isVisible['search']) {
    <editable-text formControlName="search" label="access.user-identity.search.search" />
  }
  @if (isVisible['trustedClients']) {
    <editable-selectone
      formControlName="trustedClients"
      label="access.user-identity.search.trusted-clients"
      [provider]="trustedClientsProvider"
    />
  }
  @if (isVisible['relyingPartys']) {
    <editable-selectone
      formControlName="relyingPartys"
      label="access.user-identity.search.relying-partys"
      [provider]="relyingPartysProvider"
    />
  }
  @if (isVisible['relyingParty']) {
    <editable-selectone
      formControlName="relyingParty"
      label="access.user-identity.search.relying-party"
      [provider]="relyingPartyProvider"
    />
  }
  @if (isVisible['trustedClient']) {
    <editable-selectone
      formControlName="trustedClient"
      label="access.user-identity.search.trusted-client"
      [provider]="trustedClientProvider"
    />
  }
  @if (isVisible['user']) {
    <editable-selectone formControlName="user" label="access.user-identity.search.user" [provider]="userProvider" />
  }
  @if (isVisible['users']) {
    <editable-selectone formControlName="users" label="access.user-identity.search.users" [provider]="usersProvider" />
  }
</form-layout>
