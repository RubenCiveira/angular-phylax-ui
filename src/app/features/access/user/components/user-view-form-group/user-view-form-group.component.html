<!-- @autogenerated -->
<form-layout [formGroup]="form">
  <editable-selectone
    *ngIf="isVisible['tenant']"
    formControlName="tenant"
    label="access.user.form-group.tenant"
    [provider]="tenantProvider"
  />
  <editable-text *ngIf="isVisible['name']" formControlName="name" label="access.user.form-group.name" />
  <editable-password *ngIf="isVisible['password']" formControlName="password" label="access.user.form-group.password" />
  <editable-text *ngIf="isVisible['email']" formControlName="email" label="access.user.form-group.email" />
  <editable-check *ngIf="isVisible['enabled']" formControlName="enabled" label="access.user.form-group.enabled" />
  <editable-check
    *ngIf="isVisible['temporalPassword']"
    formControlName="temporalPassword"
    label="access.user.form-group.temporal-password"
  />
  <editable-check
    *ngIf="isVisible['useSecondFactors']"
    formControlName="useSecondFactors"
    label="access.user.form-group.use-second-factors"
  />
  <editable-datetime
    *ngIf="isVisible['blockedUntil']"
    formControlName="blockedUntil"
    label="access.user.form-group.blocked-until"
  />
  <editable-text *ngIf="isVisible['language']" formControlName="language" label="access.user.form-group.language" />
  <editable-text *ngIf="isVisible['provider']" formControlName="provider" label="access.user.form-group.provider" />
</form-layout>
