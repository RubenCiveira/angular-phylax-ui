<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="tenants"
    [visible]="isVisible['tenants']"
    label="access.user.search.tenants"
    [provider]="tenantsProvider"
  />
  <editable-text formControlName="search" [visible]="isVisible['search']" label="access.user.search.search" />
  <editable-text formControlName="name" [visible]="isVisible['name']" label="access.user.search.name" />
  <editable-selectone
    formControlName="tenant"
    [visible]="isVisible['tenant']"
    label="access.user.search.tenant"
    [provider]="tenantProvider"
  />
  <editable-choose
    formControlName="order"
    [visible]="isVisible['order']"
    label="access.user.search.order"
    [options]="['', 'NAME-ASC', 'NAME-DESC']"
  />
</form-layout>
