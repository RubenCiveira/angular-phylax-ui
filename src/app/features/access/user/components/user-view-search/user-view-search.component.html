<!-- @autogenerated -->
<form-layout [formGroup]="form">
  <editable-selectone
    *ngIf="isVisible['tenants']"
    formControlName="tenants"
    label="access.user.search.tenants"
    [provider]="tenantsProvider"
  />
  <editable-text *ngIf="isVisible['search']" formControlName="search" label="access.user.search.search" />
  <editable-selectone
    *ngIf="isVisible['root']"
    formControlName="root"
    label="access.user.search.root"
    [provider]="rootProvider"
  />
  <editable-text *ngIf="isVisible['name']" formControlName="name" label="access.user.search.name" />
  <editable-choose
    *ngIf="isVisible['order']"
    formControlName="order"
    label="access.user.search.order"
    [options]="['', 'name-asc', 'name-desc']"
  />
</form-layout>
