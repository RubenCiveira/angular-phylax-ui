<!-- @autogenerated -->
<form-layout [formGroup]="form">
  @if (isVisible['tenants']) {
    <editable-selectone formControlName="tenants" label="access.user.search.tenants" [provider]="tenantsProvider" />
  }
  @if (isVisible['search']) {
    <editable-text formControlName="search" label="access.user.search.search" />
  }
  @if (isVisible['root']) {
    <editable-selectone formControlName="root" label="access.user.search.root" [provider]="rootProvider" />
  }
  @if (isVisible['name']) {
    <editable-text formControlName="name" label="access.user.search.name" />
  }
  @if (isVisible['tenant']) {
    <editable-selectone formControlName="tenant" label="access.user.search.tenant" [provider]="tenantProvider" />
  }
  @if (isVisible['order']) {
    <editable-choose
      formControlName="order"
      label="access.user.search.order"
      [options]="['', 'NAME-ASC', 'NAME-DESC']"
    />
  }
</form-layout>
