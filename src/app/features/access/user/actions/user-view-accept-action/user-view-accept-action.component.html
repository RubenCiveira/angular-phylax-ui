<!-- @autogenerated -->
<ng-template #dialogTemplate>
  <h2 mat-dialog-title>{{ 'access/user.action.accept.title' | transloco }}</h2>
  <mat-dialog-content>
    <p>{{ 'access/user.action.accept.content' | transloco }}</p>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button [mat-dialog-close]="false">{{ 'access/user.action.accept.cancelBtn' | transloco }}</button>
    <button mat-button [mat-dialog-close]="true" cdkFocusInitial>
      {{ 'access/user.action.accept.okBtn' | transloco }}
    </button>
  </mat-dialog-actions>
</ng-template>
