<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="tenant"
    [visible]="isVisible['tenant']"
    label="access.tenant-terms-of-use.form-group.tenant"
    [provider]="tenantProvider"
  />
  <editable-selectone
    formControlName="relyingParty"
    [visible]="isVisible['relyingParty']"
    label="access.tenant-terms-of-use.form-group.relying-party"
    [provider]="relyingPartyProvider"
  />
  <editable-textarea
    formControlName="text"
    [visible]="isVisible['text']"
    label="access.tenant-terms-of-use.form-group.text"
  />
  <editable-check
    formControlName="enabled"
    [visible]="isVisible['enabled']"
    label="access.tenant-terms-of-use.form-group.enabled"
  />
  <editable-upload
    formControlName="attached"
    [visible]="isVisible['attached']"
    label="access.tenant-terms-of-use.form-group.attached"
    [download]="downloadAttached"
    [upload]="uploadAttached"
  />
  <editable-datetime
    formControlName="activationDate"
    [visible]="isVisible['activationDate']"
    label="access.tenant-terms-of-use.form-group.activation-date"
  />
</form-layout>
