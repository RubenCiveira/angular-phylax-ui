<form-layout [formGroup]="form">
  @if (isVisible['tenant']) {
    <editable-selectone
      formControlName="tenant"
      label="access.tenant-terms-of-use.form-group.tenant"
      [provider]="tenantProvider"
    />
  }
  @if (isVisible['text']) {
    <editable-text formControlName="text" label="access.tenant-terms-of-use.form-group.text" />
  }
  @if (isVisible['attached']) {
    <editable-upload
      formControlName="attached"
      label="access.tenant-terms-of-use.form-group.attached"
      [download]="downloadAttached"
      [upload]="uploadAttached"
    />
  }
  <!-- # Begin: activationDate -->
  @if (isVisible['activationDate']) {
    <editable-datetime formControlName="activationDate" label="access.tenant-terms-of-use.form-group.activation-date" />
  }
  <!-- # End: activationDate --></form-layout
>
