  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="tenants"
    [visible]="isVisible['tenants']"
    label="access.tenant-terms-of-use.search.tenants"
    [provider]="tenantsProvider"
  />
  <editable-text
    formControlName="search"
    [visible]="isVisible['search']"
    label="access.tenant-terms-of-use.search.search"
  />

    formControlName="relyingPartys"
    [visible]="isVisible['relyingPartys']"
    label="access.tenant-terms-of-use.search.relying-partys"
    [provider]="relyingPartysProvider"
  />
  <editable-selectone
    formControlName="relyingParty"
    [visible]="isVisible['relyingParty']"
    label="access.tenant-terms-of-use.search.relying-party"

  />
  <editable-selectone
    formControlName="tenant"
    [visible]="isVisible['tenant']"
    label="access.tenant-terms-of-use.search.tenant"
