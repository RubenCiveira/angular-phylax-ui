<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="user"
    [visible]="isVisible['user']"
    label="access.user-group-membership.form-group.user"
    [provider]="userProvider"
  />
  <editable-selectone
    formControlName="resourceServer"
    [visible]="isVisible['resourceServer']"
    label="access.user-group-membership.form-group.resource-server"
    [provider]="resourceServerProvider"
  />
  <editable-selectone
    formControlName="oauthClient"
    [visible]="isVisible['oauthClient']"
    label="access.user-group-membership.form-group.oauth-client"
    [provider]="oauthClientProvider"
  />
  <editable-textarea
    formControlName="groups"
    [visible]="isVisible['groups']"
    label="access.user-group-membership.form-group.groups"
  />
</form-layout>
