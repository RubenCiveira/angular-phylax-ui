<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-selectone
    formControlName="user"
    [visible]="isVisible['user']"
    label="access.user-group-membership.form-group.user"
    [provider]="userProvider"
  />
  <editable-selectone
    formControlName="relyingParty"
    [visible]="isVisible['relyingParty']"
    label="access.user-group-membership.form-group.relying-party"
    [provider]="relyingPartyProvider"
  />
  <editable-selectone
    formControlName="trustedClient"
    [visible]="isVisible['trustedClient']"
    label="access.user-group-membership.form-group.trusted-client"
    [provider]="trustedClientProvider"
  />
  <editable-textarea
    formControlName="groups"
    [visible]="isVisible['groups']"
    label="access.user-group-membership.form-group.groups"
  />
</form-layout>
