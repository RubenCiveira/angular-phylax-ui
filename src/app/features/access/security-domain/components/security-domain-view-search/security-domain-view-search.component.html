<!-- @autogenerated -->
<form-layout [formGroup]="form">
  @if (isVisible['search']) {
    <editable-text formControlName="search" label="access.security-domain.search.search" />
  }
  @if (isVisible['name']) {
    <editable-text formControlName="name" label="access.security-domain.search.name" />
  }
  @if (isVisible['enabled']) {
    <editable-choose
      formControlName="enabled"
      label="access.security-domain.search.enabled"
      [options]="['', 'TRUE', 'FALSE']"
    />
  }
  @if (isVisible['order']) {
    <editable-choose
      formControlName="order"
      label="access.security-domain.search.order"
      [options]="['', 'NAME-ASC', 'NAME-DESC']"
    />
  }
</form-layout>
