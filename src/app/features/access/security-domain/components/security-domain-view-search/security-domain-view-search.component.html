    *ngIf="isVisible['tenants']"
    formControlName="tenants"
    label="access.security-domain.search.tenants"
    [provider]="tenantsProvider"
  />

  <editable-text *ngIf="isVisible['name']" formControlName="name" label="access.security-domain.search.name" />

    *ngIf="isVisible['order']"
    formControlName="order"
    label="access.security-domain.search.order"
    [options]="['', 'name-asc', 'name-desc']"
  />
