<!-- @autogenerated -->
<form-layout [formGroup]="form">
  @if (isVisible['name']) {
    <editable-text formControlName="name" label="access.tenant.form-group.name" />
  }
  @if (isVisible['domain']) {
    <editable-text formControlName="domain" label="access.tenant.form-group.domain" />
  }
  @if (isVisible['enabled']) {
    <editable-check formControlName="enabled" label="access.tenant.form-group.enabled" />
  }
  @if (isVisible['accessToAllApplications']) {
    <editable-check
      formControlName="accessToAllApplications"
      label="access.tenant.form-group.access-to-all-applications"
    />
  }
  @if (isVisible['trustedClients']) {
    <editable-chips
      formControlName="trustedClients"
      label="access.tenant.form-group.trusted-clients"
      [render]="trustedClientsRender"
      [provider]="trustedClientsProvider"
    />
  }
  @if (isVisible['relingParties']) {
    <editable-chips
      formControlName="relingParties"
      label="access.tenant.form-group.reling-parties"
      [render]="relingPartiesRender"
      [provider]="relingPartiesProvider"
    />
  }
</form-layout>
