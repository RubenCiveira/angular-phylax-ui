<!-- @autogenerated -->
<form-layout [formGroup]="form">
  <editable-text *ngIf="isVisible['name']" formControlName="name" label="access.tenant.form-group.name" />
  <editable-text *ngIf="isVisible['domain']" formControlName="domain" label="access.tenant.form-group.domain" />
  <editable-check *ngIf="isVisible['enabled']" formControlName="enabled" label="access.tenant.form-group.enabled" />
  <editable-check
    *ngIf="isVisible['accessToAllApplications']"
    formControlName="accessToAllApplications"
    label="access.tenant.form-group.access-to-all-applications"
  />
  <editable-chips
    *ngIf="isVisible['trustedClients']"
    formControlName="trustedClients"
    label="access.tenant.form-group.trusted-clients"
    [render]="trustedClientsRender"
    [provider]="trustedClientsProvider"
  />
  <editable-chips
    *ngIf="isVisible['relingParties']"
    formControlName="relingParties"
    label="access.tenant.form-group.reling-parties"
    [render]="relingPartiesRender"
    [provider]="relingPartiesProvider"
  />
</form-layout>
