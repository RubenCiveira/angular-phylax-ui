<!-- @autogenerated -->
<form-layout
  [formGroup]="form"
  class="u-grid"
  style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
>
  <editable-text formControlName="name" [visible]="isVisible['name']" label="access.tenant.form-group.name" />
  <editable-check formControlName="root" [visible]="isVisible['root']" label="access.tenant.form-group.root" />
  <editable-text formControlName="domain" [visible]="isVisible['domain']" label="access.tenant.form-group.domain" />
  <editable-check formControlName="enabled" [visible]="isVisible['enabled']" label="access.tenant.form-group.enabled" />
  <editable-check
    formControlName="markForDelete"
    [visible]="isVisible['markForDelete']"
    label="access.tenant.form-group.mark-for-delete"
  />
  <editable-datetime
    formControlName="markForDeleteTime"
    [visible]="isVisible['markForDeleteTime']"
    label="access.tenant.form-group.mark-for-delete-time"
  />
</form-layout>
