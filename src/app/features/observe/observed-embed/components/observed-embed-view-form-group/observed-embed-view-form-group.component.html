<!-- @autogenerated -->
<form-layout [formGroup]="form" style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4">
  <editable-text formControlName="name" [visible]="isVisible['name']" label="observe/observed-embed.form-group.name" />
  <editable-selectone
    formControlName="dashboard"
    [visible]="isVisible['dashboard']"
    label="observe/observed-embed.form-group.dashboard"
    [provider]="dashboardProvider"
  />
  <editable-text
    formControlName="panelUid"
    [visible]="isVisible['panelUid']"
    label="observe/observed-embed.form-group.panel-uid"
  />
  <editable-selectone
    formControlName="origin"
    [visible]="isVisible['origin']"
    label="observe/observed-embed.form-group.origin"
    [provider]="originProvider"
  />
  <editable-password
    formControlName="tokenHash"
    [visible]="isVisible['tokenHash']"
    label="observe/observed-embed.form-group.token-hash"
  />
  <editable-text
    formControlName="allowedOrigins"
    [visible]="isVisible['allowedOrigins']"
    label="observe/observed-embed.form-group.allowed-origins"
  />
  <editable-choose
    formControlName="maxRange"
    [visible]="isVisible['maxRange']"
    label="observe/observed-embed.form-group.max-range"
    [options]="['hour', 'six-hours', 'day', 'week', 'month']"
  />
  <editable-integer
    formControlName="minRefresh"
    [visible]="isVisible['minRefresh']"
    label="observe/observed-embed.form-group.min-refresh"
  />
  <editable-check
    formControlName="allowRaw"
    [visible]="isVisible['allowRaw']"
    label="observe/observed-embed.form-group.allow-raw"
  />
  <editable-datetime
    formControlName="expiresAt"
    [visible]="isVisible['expiresAt']"
    label="observe/observed-embed.form-group.expires-at"
  />
  <editable-datetime
    formControlName="lastUsedAt"
    [visible]="isVisible['lastUsedAt']"
    label="observe/observed-embed.form-group.last-used-at"
  />
  <editable-check
    formControlName="enabled"
    [visible]="isVisible['enabled']"
    label="observe/observed-embed.form-group.enabled"
  />
</form-layout>
