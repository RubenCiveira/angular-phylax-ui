<!-- @autogenerated -->
<form-layout [formGroup]="form" style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4">
  <editable-selectone
    formControlName="rule"
    [visible]="isVisible['rule']"
    label="observe/observed-alert.form-group.rule"
    [provider]="ruleProvider"
  />
  <editable-text
    formControlName="problemKey"
    [visible]="isVisible['problemKey']"
    label="observe/observed-alert.form-group.problem-key"
  />
  <editable-choose
    formControlName="status"
    [visible]="isVisible['status']"
    label="observe/observed-alert.form-group.status"
    [options]="['firing', 'resolved']"
  />
  <editable-text
    formControlName="summary"
    [visible]="isVisible['summary']"
    label="observe/observed-alert.form-group.summary"
  />
  <editable-text formControlName="link" [visible]="isVisible['link']" label="observe/observed-alert.form-group.link" />
  <editable-datetime
    formControlName="firedAt"
    [visible]="isVisible['firedAt']"
    label="observe/observed-alert.form-group.fired-at"
  />
  <editable-datetime
    formControlName="resolvedAt"
    [visible]="isVisible['resolvedAt']"
    label="observe/observed-alert.form-group.resolved-at"
  />
  <editable-datetime
    formControlName="lastNotifiedAt"
    [visible]="isVisible['lastNotifiedAt']"
    label="observe/observed-alert.form-group.last-notified-at"
  />
</form-layout>
