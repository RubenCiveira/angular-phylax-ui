<!-- @autogenerated -->
<form-layout [formGroup]="form" style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4">
  <editable-text
    formControlName="search"
    [visible]="isVisible['search']"
    label="observe/observed-issue.search.search"
  />
  <editable-text formControlName="level" [visible]="isVisible['level']" label="observe/observed-issue.search.level" />
  <editable-text formControlName="kind" [visible]="isVisible['kind']" label="observe/observed-issue.search.kind" />
  <editable-selectone
    formControlName="origin"
    [visible]="isVisible['origin']"
    label="observe/observed-issue.search.origin"
    [provider]="originProvider"
  />
  <editable-text
    formControlName="fingerprint"
    [visible]="isVisible['fingerprint']"
    label="observe/observed-issue.search.fingerprint"
  />
  <editable-text formControlName="title" [visible]="isVisible['title']" label="observe/observed-issue.search.title" />
  <editable-text
    formControlName="status"
    [visible]="isVisible['status']"
    label="observe/observed-issue.search.status"
  />
  <editable-choose
    formControlName="order"
    [visible]="isVisible['order']"
    label="observe/observed-issue.search.order"
    [options]="['', 'title-asc', 'title-desc']"
  />
</form-layout>
