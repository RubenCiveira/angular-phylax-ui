    label="observe/observed-probe.form-group.interval-seconds"
  />
  <editable-integer
    formControlName="failuresToAlert"
    [visible]="isVisible['failuresToAlert']"
    label="observe/observed-probe.form-group.failures-to-alert"

  <editable-integer
    formControlName="tlsWarnDays"
    [visible]="isVisible['tlsWarnDays']"

  <editable-choose
    formControlName="lastStatus"
    [visible]="isVisible['lastStatus']"

  <editable-datetime
