<!-- @autogenerated -->
<form-layout [formGroup]="form" style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4">
  <editable-text
    formControlName="code"
    [visible]="isVisible['code']"
    label="observe/observed-dashboard.form-group.code"
  />
  <editable-text
    formControlName="name"
    [visible]="isVisible['name']"
    label="observe/observed-dashboard.form-group.name"
  />
  <editable-text
    formControlName="description"
    [visible]="isVisible['description']"
    label="observe/observed-dashboard.form-group.description"
  />
  <editable-check
    formControlName="builtin"
    [visible]="isVisible['builtin']"
    label="observe/observed-dashboard.form-group.builtin"
  />
  <editable-check
    formControlName="sourceVariable"
    [visible]="isVisible['sourceVariable']"
    label="observe/observed-dashboard.form-group.source-variable"
  />
  <editable-choose
    formControlName="sourceKind"
    [visible]="isVisible['sourceKind']"
    label="observe/observed-dashboard.form-group.source-kind"
    [options]="['backend', 'frontend', 'worker', 'mobile']"
  />
  <editable-choose
    formControlName="defaultRange"
    [visible]="isVisible['defaultRange']"
    label="observe/observed-dashboard.form-group.default-range"
    [options]="['hour', 'six-hours', 'day', 'week', 'month']"
  />
  <editable-choose
    formControlName="refresh"
    [visible]="isVisible['refresh']"
    label="observe/observed-dashboard.form-group.refresh"
    [options]="['manual', 'ten-seconds', 'thirty-seconds', 'minute', 'five-minutes']"
  />
  <editable-repeat
    formControlName="panels"
    [visible]="isVisible['panels']"
    label="observe/observed-dashboard.form-group.panels"
    [provider]="panelsProvider"
  >
    <ng-template let-form let-isVisible="isVisible">
      <form-layout [formGroup]="form">
        <div>
          <editable-text
            formControlName="title"
            [visible]="isVisible['title']"
            label="observe/observed-dashboard.form-group.title"
          />
        </div>
        <div>
          <editable-text
            formControlName="description"
            [visible]="isVisible['description']"
            label="observe/observed-dashboard.form-group.description"
          />
        </div>
        <div>
          <editable-text
            formControlName="chartType"
            [visible]="isVisible['chartType']"
            label="observe/observed-dashboard.form-group.chart-type"
          />
        </div>
        <div>
          <editable-textarea
            formControlName="query"
            [visible]="isVisible['query']"
            label="observe/observed-dashboard.form-group.query"
          />
        </div>
        <div>
          <editable-textarea
            formControlName="options"
            [visible]="isVisible['options']"
            label="observe/observed-dashboard.form-group.options"
          />
        </div>
        <div>
          <editable-integer
            formControlName="x"
            [visible]="isVisible['x']"
            label="observe/observed-dashboard.form-group.x"
          />
        </div>
        <div>
          <editable-integer
            formControlName="y"
            [visible]="isVisible['y']"
            label="observe/observed-dashboard.form-group.y"
          />
        </div>
        <div>
          <editable-integer
            formControlName="w"
            [visible]="isVisible['w']"
            label="observe/observed-dashboard.form-group.w"
          />
        </div>
        <div>
          <editable-integer
            formControlName="h"
            [visible]="isVisible['h']"
            label="observe/observed-dashboard.form-group.h"
          />
        </div>
      </form-layout>
    </ng-template>
  </editable-repeat>
</form-layout>
