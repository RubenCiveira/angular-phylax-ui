<!-- @autogenerated -->
<form-layout [formGroup]="form" style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4">
  <editable-text formControlName="name" [visible]="isVisible['name']" label="observe/observed-slo.form-group.name" />
  <editable-selectone
    formControlName="origin"
    [visible]="isVisible['origin']"
    label="observe/observed-slo.form-group.origin"
    [provider]="originProvider"
  />
  <editable-text formControlName="route" [visible]="isVisible['route']" label="observe/observed-slo.form-group.route" />
  <editable-choose
    formControlName="kind"
    [visible]="isVisible['kind']"
    label="observe/observed-slo.form-group.kind"
    [options]="['availability', 'latency']"
  />
  <editable-integer
    formControlName="objective"
    [visible]="isVisible['objective']"
    label="observe/observed-slo.form-group.objective"
  />
  <editable-integer
    formControlName="latencyMs"
    [visible]="isVisible['latencyMs']"
    label="observe/observed-slo.form-group.latency-ms"
  />
  <editable-integer
    formControlName="windowDays"
    [visible]="isVisible['windowDays']"
    label="observe/observed-slo.form-group.window-days"
  />
  <editable-check
    formControlName="enabled"
    [visible]="isVisible['enabled']"
    label="observe/observed-slo.form-group.enabled"
  />
</form-layout>
