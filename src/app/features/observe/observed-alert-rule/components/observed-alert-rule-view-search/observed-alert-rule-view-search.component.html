<!-- @autogenerated -->
<form-layout [formGroup]="form" style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4">
  <editable-text
    formControlName="search"
    [visible]="isVisible['search']"
    label="observe/observed-alert-rule.search.search"
  />
  <editable-selectone
    formControlName="origin"
    [visible]="isVisible['origin']"
    label="observe/observed-alert-rule.search.origin"
    [provider]="originProvider"
  />
  <editable-text formControlName="name" [visible]="isVisible['name']" label="observe/observed-alert-rule.search.name" />
  <editable-selectone
    formControlName="origins"
    [visible]="isVisible['origins']"
    label="observe/observed-alert-rule.search.origins"
    [provider]="originsProvider"
  />
  <editable-text
    formControlName="trigger"
    [visible]="isVisible['trigger']"
    label="observe/observed-alert-rule.search.trigger"
  />
  <editable-choose
    formControlName="order"
    [visible]="isVisible['order']"
    label="observe/observed-alert-rule.search.order"
    [options]="['', 'name-asc', 'name-desc']"
  />
</form-layout>
