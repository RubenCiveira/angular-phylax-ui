<!-- @autogenerated -->
<form-layout [formGroup]="form" style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4">
  <editable-text
    formControlName="name"
    [visible]="isVisible['name']"
    label="observe/observed-alert-rule.form-group.name"
  />
  <editable-choose
    formControlName="trigger"
    [visible]="isVisible['trigger']"
    label="observe/observed-alert-rule.form-group.trigger"
    [options]="[
      'new-issue',
      'regression',
      'error-rate',
      'source-silent',
      'collector-dropping',
      'slo-burn',
      'probe-down',
      'tls-expiring',
      'anomaly',
      'disk-high',
    ]"
  />
  <editable-selectone
    formControlName="origin"
    [visible]="isVisible['origin']"
    label="observe/observed-alert-rule.form-group.origin"
    [provider]="originProvider"
  />
  <editable-choose
    formControlName="minLevel"
    [visible]="isVisible['minLevel']"
    label="observe/observed-alert-rule.form-group.min-level"
    [options]="['error', 'fatal']"
  />
  <editable-integer
    formControlName="threshold"
    [visible]="isVisible['threshold']"
    label="observe/observed-alert-rule.form-group.threshold"
  />
  <editable-integer
    formControlName="windowMinutes"
    [visible]="isVisible['windowMinutes']"
    label="observe/observed-alert-rule.form-group.window-minutes"
  />
  <editable-choose
    formControlName="channel"
    [visible]="isVisible['channel']"
    label="observe/observed-alert-rule.form-group.channel"
    [options]="['log', 'webhook', 'email']"
  />
  <editable-text
    formControlName="target"
    [visible]="isVisible['target']"
    label="observe/observed-alert-rule.form-group.target"
  />
  <editable-integer
    formControlName="cooldownMinutes"
    [visible]="isVisible['cooldownMinutes']"
    label="observe/observed-alert-rule.form-group.cooldown-minutes"
  />
  <editable-datetime
    formControlName="mutedUntil"
    [visible]="isVisible['mutedUntil']"
    label="observe/observed-alert-rule.form-group.muted-until"
  />
  <editable-check
    formControlName="enabled"
    [visible]="isVisible['enabled']"
    label="observe/observed-alert-rule.form-group.enabled"
  />
</form-layout>
