<!-- @autogenerated -->
<mat-toolbar>
  <button mat-icon-button class="menu-toggle" aria-label="Menu" (click)="toogleMenu()">
    <mat-icon>menu</mat-icon>
  </button>

  <div class="spacer"></div>

  <form-layout [formGroup]="form" class="toolbar-context">
    @for (pr of providerList(); track pr.key) {
      <editable-selectone
        [formControlName]="pr.key"
        class="form-layout-col-lg-6 form-layout-col-12"
        [label]="pr.key"
        [provider]="pr.value"
      />
    }
  </form-layout>

  @if (user()?.authenticated) {
    <button class="account" [matMenuTriggerFor]="userMenu" [attr.aria-label]="user()?.name">
      <span class="avatar" aria-hidden="true">{{ initial() }}</span>
      <span class="account-name">{{ user()?.name }}</span>
      <mat-icon class="account-more" aria-hidden="true">unfold_more</mat-icon>
    </button>
  } @else {
    <!-- Sin sesión no hay nada que elegir: el botón inicia sesión directamente -->
    <button class="account" (click)="login()" aria-label="login">
      <span class="avatar" aria-hidden="true"><mat-icon>login</mat-icon></span>
      <span class="account-name">login</span>
    </button>
  }
</mat-toolbar>

<mat-menu #userMenu="matMenu" yPosition="above">
  @if (user()?.authenticated) {
    @if (accountUrl()) {
      <button mat-menu-item (click)="account()"><mat-icon>manage_accounts</mat-icon>account</button>
      <mat-divider />
    }
    <button mat-menu-item (click)="logout()"><mat-icon>logout</mat-icon>logout</button>
  }
</mat-menu>
