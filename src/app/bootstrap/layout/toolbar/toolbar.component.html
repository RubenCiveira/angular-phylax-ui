<!-- @autogenerated -->
<mat-toolbar>
  <button mat-icon-button (click)="toogleMenu()"><mat-icon>menu</mat-icon></button>

  <div class="spacer">
    <span class="title"> {{ user()?.name }} </span>
  </div>

  <form-layout
    [formGroup]="form"
    class="u-grid"
    style="--form-layout-def-xs: 12; --form-layout-def-md: 6; --form-layout-def-lg: 4"
  >
    @for (pr of providerList(); track pr.key) {
      <editable-selectone
        [formControlName]="pr.key"
        class="form-layout-col-lg-6 form-layout-col-12"
        [label]="pr.key"
        [provider]="pr.value"
      />
    }
  </form-layout>

  @if (user()?.authenticated) {
    <button mat-icon-button [matMenuTriggerFor]="userMenu">
      <mat-icon>account_circle</mat-icon>
    </button>
  } @else {
    <button mat-icon-button [matMenuTriggerFor]="userMenu">
      <mat-icon>lock</mat-icon>
    </button>
  }
</mat-toolbar>

<mat-menu #userMenu="matMenu">
  @if (user()?.authenticated) {
    @if (accountUrl()) {
      <button mat-menu-item (click)="account()">account</button>
      <hr />
    }
    <button mat-menu-item (click)="logout()">logout</button>
  } @else {
    <button mat-menu-item (click)="login()">login</button>
  }
</mat-menu>
