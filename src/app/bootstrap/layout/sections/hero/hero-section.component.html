<!-- @autogenerated -->
<section [attr.aria-labelledby]="titleId">
  @if (brand()) {
    <div class="brand">
      <img class="brand-logo" [src]="logo()" alt="" />
      <span class="brand-name">{{ productName() }}</span>
    </div>
  }
  @if (image()) {
    <img class="illustration" [src]="image()" alt="" />
  }
  <h1 [id]="titleId">{{ title() }}</h1>
  @if (lead()) {
    <p class="lead">{{ lead() }}</p>
  }
  <div class="actions">
    <ng-content />
  </div>
  <div class="hint">
    <ng-content select="[hint]" />
  </div>
</section>
