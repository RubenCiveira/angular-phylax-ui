<!-- @autogenerated -->
@if (features().length) {
  <section [attr.aria-labelledby]="titleId">
    <h2 [id]="titleId">{{ 'sections.features.title' | transloco }}</h2>
    <ul>
      @for (feature of features(); track feature.key) {
        <li class="feature">
          <mat-icon class="feature-icon" aria-hidden="true">{{ feature.icon || 'apps' }}</mat-icon>
          <h3>{{ feature.title }}</h3>
          <p>{{ feature.text }}</p>
        </li>
      }
    </ul>
  </section>
}
