<!-- @autogenerated -->
<nav aria-label="Main menu" [attr.aria-hidden]="isMobile && !navOverlayOpen ? 'true' : null">
  <app-menu [items]="currentMenu()" [mode]="navMode" (select)="closeOverlay()">
    <button navToggle mat-icon-button aria-label="Menu" (click)="toggleNav()"><mat-icon>menu</mat-icon></button>
  </app-menu>
</nav>

<header [attr.inert]="isMobile && navOverlayOpen ? '' : null">
  <app-toolbar (menuClicked)="toggleNav()" [user]="currentUser()" [providers]="contextProviders" />
</header>

<main [attr.inert]="isMobile && navOverlayOpen ? '' : null">
  @if (bootstrap) {
    <router-outlet />
  } @else {
    <app-bootstrap [error]="bootstrapError" />
  }
</main>
<footer [attr.inert]="isMobile && navOverlayOpen ? '' : null">
  <app-footer />
</footer>

@if (redirecting()) {
  <!-- Redirección al proveedor de identidad: puede tardar y la página no cambia hasta que responde -->
  <div class="redirect-overlay" role="status" aria-live="polite">
    <mat-spinner diameter="40" />
    <p>{{ (redirecting() === 'login' ? 'auth.redirecting' : 'auth.signingOut') | transloco }}</p>
  </div>
}

<!-- Backdrop -->
<div class="nav-backdrop" (click)="closeOverlay()" aria-hidden="true"></div>
