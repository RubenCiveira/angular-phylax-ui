<!-- @autogenerated -->
<mat-form-field>
  <mat-label>{{ label() + '.label' }}</mat-label>
  <input matInput [disabled]="true" />
  <mat-icon matSuffix (click)="selectFile()">cloud_upload</mat-icon>
  <mat-error *ngFor="let error of errorMessages()">
    {{ label() + '.error.' + error | transloco }}
  </mat-error>
</mat-form-field>

<ng-template #fileDialog>
  <div style="display: flex">
    <button mat-icon-button (click)="dialogRef?.close()">
      <mat-icon>close</mat-icon>
    </button>
    <p mat-dialog-title mat-dialog-title>
      {{ 'component.fileupload.selectFile' | transloco }}
    </p>
  </div>
  <mat-dialog-content style="position: relative">
    <div class="form-group img-registry mat-typography">
      <button mat-stroked-button (click)="openFileBrowser($event, openButton)">
        {{ 'component.fileupload.chooseFile' | transloco }}
      </button>
      <input #openButton style="display: none" (change)="showPreviewImage($event)" type="file" />
    </div>
    <div *ngIf="loading()">
      <mat-progress-bar [value]="progressValue()"></mat-progress-bar>
      <span>{{ progressValue() }}%</span>
    </div>
  </mat-dialog-content>
  <mat-divider style="margin: 0px -25px 0px -25px"></mat-divider>
  <mat-dialog-actions style="display: flex">
    <span style="flex: 1"></span>
    <button mat-button color="warn" (click)="save(null)">{{ 'component.fileupload.quit' | transloco }}</button>
    <button [disabled]="!response()" mat-button color="primary" (click)="save(response())">
      {{ 'component.fileupload.accept' | transloco }}
    </button>
  </mat-dialog-actions>
</ng-template>
