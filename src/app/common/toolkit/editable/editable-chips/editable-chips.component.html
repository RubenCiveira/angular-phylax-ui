<!-- @autogenerated -->
<mat-form-field>
  <mat-label>{{ label() + '.label' | transloco }}</mat-label>

  <mat-chip-grid [required]="required()" #chipList [disabled]="control.disabled">
    <mat-chip-row [removable]="!control.disabled" (removed)="removeChip(item)" *ngFor="let item of control.value">
      {{ render().display(item) }}
      <mat-icon matChipRemove *ngIf="!control.disabled">cancel</mat-icon>
    </mat-chip-row>

    <input
      #inputForChips
      matInput
      placeholder="{{ label() + '.placeholder' | transloco }}"
      [matChipInputFor]="chipList"
      [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
      [matChipInputAddOnBlur]="true"
      (matChipInputTokenEnd)="addChip($event.value)"
      [formControl]="search"
      [matAutocomplete]="autoForChips"
    />
    <mat-progress-bar *ngIf="provider().searching()" mode="indeterminate"></mat-progress-bar>
  </mat-chip-grid>
  <mat-icon matSuffix *ngIf="!control.disabled" (click)="searchOptions()">keyboard_arrow_down</mat-icon>
  <mat-error *ngFor="let error of errorMessages()">
    {{ label() + '.error.' + error | transloco }}
  </mat-error>
</mat-form-field>

<mat-autocomplete #autoForChips (optionSelected)="addSelectChip($event.option.value)">
  <mat-option *ngFor="let item of provider()()" [value]="item">
    {{ provider().display(item) }}
  </mat-option>
</mat-autocomplete>
