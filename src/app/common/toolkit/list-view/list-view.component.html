<!-- @autogenerated -->
<ng-container *ngIf="searching() && !data()">
  <div
    class="ghost-element"
    *ngFor="let item of [].constructor(20)"
    [ngStyle]="{ height: itemHeight + 'px', overflow: 'hidden' }"
  >
    <div class="ghost-line" style="width: 100%; height: 16px">{{ item }}</div>
  </div>
</ng-container>
<ng-container *ngIf="!searching() || data()?.length">
  <div *ngIf="!mobile()" class="material-table">
    <div class="thead">
      <span class="th" style="width: 52px" *ngIf="!!this.selectionMultiple()"></span>
      <ng-container *ngFor="let column of table()?.columns()">
        <span
          class="th"
          [ngClass]="{ small: !column.title() }"
          [ngStyle]="{ width: column.displayWidth + 'px', height: column.displayHeight + 'px' }"
          *ngIf="column.visible"
        >
          {{ column.title() }}
        </span>
      </ng-container>
    </div>
    <div class="tbody">
      <cdk-virtual-scroll-viewport #tableScroll class="tcontent" [itemSize]="itemHeight">
        <div class="tr" *cdkVirtualFor="let item of data()">
          <span *ngIf="selectionMultiple()" style="width: 52px">
            <mat-checkbox (change)="check(item)" [checked]="isSelected(item)" (click)="$event.stopPropagation()" />
          </span>
          <ng-container *ngFor="let column of table()?.columns()">
            <span
              class="td"
              *ngIf="column.visible"
              [ngClass]="{ small: !column.title() }"
              [ngStyle]="{ width: column.displayWidth + 'px', height: column.displayHeight + 'px' }"
              (click)="selectAndActivate(item)"
            >
              <ng-container *ngTemplateOutlet="column.template; context: { $implicit: item }"></ng-container>
            </span>
          </ng-container>
        </div>
      </cdk-virtual-scroll-viewport>
    </div>
  </div>
  <ul *ngIf="mobile()" class="material-list">
    <cdk-virtual-scroll-viewport #listScroll class="lcontent" [itemSize]="itemHeight">
      <li *cdkVirtualFor="let item of data()" class="material-list-item">
        <div *ngIf="row().icon()" class="material-list-item-icon-container">
          <i class="material-list-item-icon">
            <ng-container *ngTemplateOutlet="row().icon()!.template; context: { $implicit: item }"></ng-container>
          </i>
        </div>
        <div class="material-list-item-content">
          <h3 *ngIf="row().title()" class="material-list-item-title">
            <ng-container *ngTemplateOutlet="row().title()!.template; context: { $implicit: item }"></ng-container>
          </h3>
          <p *ngIf="row().subtitle()" class="material-list-item-subtitle">
            <ng-container *ngTemplateOutlet="row().subtitle()!.template; context: { $implicit: item }"></ng-container>
          </p>
          <div *ngIf="row().text()" class="material-list-item-subcontent">
            <ng-container *ngTemplateOutlet="row().text()!.template; context: { $implicit: item }"></ng-container>
          </div>
        </div>
        <div *ngIf="null !== row().icon() || null !== row().trailing()" class="material-list-item-actions">
          <ng-container *ngIf="row().trailing()">
            <ng-container *ngTemplateOutlet="row().trailing()!.template; context: { $implicit: item }"></ng-container>
          </ng-container>
          <ng-container *ngIf="row().action()">
            <ng-container *ngTemplateOutlet="row().action()!.template; context: { $implicit: item }"></ng-container>
          </ng-container>
        </div>
      </li>
    </cdk-virtual-scroll-viewport>
  </ul>
  <mat-progress-bar *ngIf="searching()" mode="indeterminate"></mat-progress-bar>
</ng-container>
